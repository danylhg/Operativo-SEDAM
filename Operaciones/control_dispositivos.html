<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control de Dispositivos</title>
  <script src="js/api_config.js"></script>
  <script src="js/auth_check.js"></script>
  <link rel="stylesheet" href="css/control_personal.css?v=1.3" />
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <button id="btnBack" class="backOnly" type="button" aria-label="Volver" title="Volver">
        <svg viewBox="0 0 24 24" focusable="false" width="20" height="20">
          <path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <div class="topActions">
      <div class="logo" aria-label="Logo SEDAM"></div>
      <div class="controlUserMenu">
        <button class="userButton" type="button" aria-haspopup="true" aria-expanded="false" style="border:none!important;background:transparent!important;box-shadow:none!important;">
          <span class="userIcon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"></path>
              <path d="M4.5 20a7.5 7.5 0 0 1 15 0"></path>
            </svg>
          </span>
          <span id="controlUserName">Admin</span>
        </button>
        <div class="userDropdown">
          <button id="btnLogout" type="button">Cerrar sesi&oacute;n</button>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="panel">
      <div class="panelHead">
        <div>
          <h1 class="title">Control de Dispositivos</h1>
          <p class="subtitle">Administra tablets, teléfonos y otros dispositivos registrados</p>
        </div>
      </div>

      <!-- Filtros -->
      <div class="filtersCard">
        <div class="field searchField">
          <label>Buscar</label>
          <input id="searchInput" type="text" placeholder="Buscar por tipo, marca, modelo, teléfono, IMEI..." />
        </div>

        <div class="field filterField">
          <label>Filtro por Tipo</label>
          <select id="filterTipo">
            <option value="">Todos</option>
            <option value="TELEFONO">Teléfono</option>
            <option value="TABLET">Tablet</option>
            <option value="SMARTWATCH">Smart watch</option>
            <option value="LORA">LoRa</option>
            <option value="LAPTOP">Laptop</option>
            <option value="RADIO">Radio</option>
            <option value="GPS">GPS</option>
            <option value="OTRO">Otro</option>
          </select>
        </div>

        <div class="field filterField">
          <label>Filtro por Estado</label>
          <select id="filterEstado">
            <option value="">Todos</option>
            <option value="DISPONIBLE">DISPONIBLE</option>
            <option value="ASIGNADO">ASIGNADO</option>
            <option value="MANTENIMIENTO">MANTENIMIENTO</option>
            <option value="BAJA">BAJA</option>
          </select>
        </div>

        <button id="btnClear" class="btn" type="button">Limpiar</button>
      </div>

      <!-- Tabla -->
      <div class="tableCard">
        <div class="tableHead">
          <span id="resultHint" class="hint"></span>
          <div class="tableActions">
            <button id="btnAdd" class="btn primary">
              <span class="btnIcon" aria-hidden="true" data-emoji="＋">
                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                  <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
              </span>
              Agregar
            </button>
            <button id="btnEdit" class="btn soft" disabled>
              <span class="btnIcon" aria-hidden="true" data-emoji="✎">
                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                  <path d="M5 19h4l10-10-4-4-10 10v4Z" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M14 5l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
              </span>
              Modificar
            </button>
            <button id="btnDelete" class="btn danger" disabled>
              <span class="btnIcon" aria-hidden="true" data-emoji="×">
                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                  <path d="M6 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  <path d="M8 7v11a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
                  <path d="M10 11v4M14 11v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
              </span>
              Eliminar
            </button>
          </div>
        </div>

        <div class="tableWrap">
          <table class="tbl">
            <thead>
              <tr>
                <th>Imagen</th>
                <th>Tipo</th>
                <th>Marca</th>
                <th>Modelo</th>
                <th>Núm. teléfono</th>
                <th>IMEI</th>
                <th>Núm. serie</th>
                <th>Estado</th>
                <th>Responsable</th>
                <th>Fecha registro</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <div id="modal" class="modal hidden" aria-hidden="true">
      <div class="modalBackdrop" data-close="true"></div>

      <div class="modalCard" role="dialog" aria-modal="true">
        <div class="modalHead">
          <div class="modalTitle" id="modalTitle">Agregar dispositivo</div>
            <button class="iconBtn" id="btnCloseModal" title="Cerrar" aria-label="Cerrar" data-emoji="×">
              <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                <path d="M6 6l12 12M18 6l-12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </button>
        </div>

        <form id="form" class="modalBody">
          <div class="grid2">
            <div class="field">
              <label>Imagen del dispositivo</label>
              <div id="dropZoneDisp" class="dropZone">
                <div class="dropZoneText">Haz clic o arrastra una imagen aqui</div>
                <input id="fImagenDisp" type="file" accept="image/*" hidden />
                <img id="previewImgDisp" class="dropZonePreview" alt="Vista previa">
              </div>
            </div>

            <div class="field">
              <label>Tipo</label>
              <select id="fTipo" required>
                <option value="" disabled selected>Selecciona...</option>
                <option value="TELEFONO">Teléfono</option>
                <option value="TABLET">Tablet</option>
                <option value="SMARTWATCH">Smart watch</option>
                <option value="LORA">LoRa</option>
                <option value="LAPTOP">Laptop</option>
                <option value="RADIO">Radio</option>
                <option value="GPS">GPS</option>
                <option value="OTRO">Otro</option>
              </select>
            </div>

            <div class="field">
              <label>Marca</label>
              <input id="fMarca" type="text" maxlength="80" required />
            </div>

            <div class="field">
              <label>Modelo</label>
              <input id="fModelo" type="text" maxlength="80" required />
            </div>

            <div class="field">
              <label>Núm. teléfono</label>
              <input id="fNumeroTelefono" type="tel" inputmode="numeric" maxlength="10" placeholder="10 dígitos" />
            </div>

            <div class="field">
              <label>IMEI</label>
              <input id="fImei" type="text" maxlength="40" />
            </div>

            <div class="field">
              <label>Núm. serie</label>
              <input id="fNumeroSerie" type="text" maxlength="80" />
            </div>

            <div class="field">
              <label>Sistema operativo</label>
              <select id="fSistemaOperativo">
                <option value="" selected>Selecciona...</option>
                <option value="Android">Android</option>
                <option value="Wear OS">Wear OS</option>
                <option value="iOS">iOS</option>
                <option value="Windows">Windows</option>
                <option value="HarmonyOS">HarmonyOS</option>
                <option value="Linux">Linux</option>
                <option value="Otro">Otro</option>
              </select>
            </div>

            <div class="field full">
              <label>Detalles</label>
              <textarea id="fDetalles" class="detailsTextarea" rows="4" placeholder="Accesorios, cargador, SIM, observaciones..."></textarea>
            </div>
          </div>

          <div class="modalActions">
            <button type="button" id="btnDeleteModal" class="btn danger">
              <span class="btnIcon" aria-hidden="true" data-emoji="×">
                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                  <path d="M6 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  <path d="M8 7v11a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
                  <path d="M10 11v4M14 11v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
              </span>
              Eliminar
            </button>
            <button type="submit" id="btnSave" class="btn primary">
              <span class="btnIcon" aria-hidden="true" data-emoji="✓">
                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                  <path d="M6 12l4 4 8-8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
              Guardar
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="js/control_dispositivos.js"></script>
</body>
</html>
