<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Control de Personal</title>
  <script src="js/api_config.js"></script>
  <script src="js/auth_check.js"></script>
  <link rel="stylesheet" href="css/control_personal.css?v=1.3" />
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <button id="btnBack" class="backOnly" type="button" aria-label="Volver" title="Volver">
        <svg viewBox="0 0 24 24" focusable="false" width="20" height="20">
          <path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <div class="topActions">
      <div class="logo" aria-label="Logo SEDAM"></div>
      <div class="controlUserMenu">
        <button class="userButton" type="button" aria-haspopup="true" aria-expanded="false" style="border:none!important;background:transparent!important;box-shadow:none!important;">
          <span class="userIcon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"></path>
              <path d="M4.5 20a7.5 7.5 0 0 1 15 0"></path>
            </svg>
          </span>
          <span id="controlUserName">Admin</span>
        </button>
        <div class="userDropdown">
          <button id="btnLogout" type="button">Cerrar sesi&oacute;n</button>
        </div>
      </div>
    </div>
  </header>

  <div class="bgOrbs" aria-hidden="true">
    <span class="orb orb1"></span>
    <span class="orb orb2"></span>
    <span class="orb orb3"></span>
  </div>

  <main class="wrap">
    <section class="panel">
      <div class="panelHead">
        <div>
          <h1 class="title">Control de Personal</h1>
          <p class="subtitle">Administra personal operativo, roles y accesos registrados</p>
        </div>
      </div>

      <!-- Filtros -->
      <div class="filtersCard">
        <div class="field searchField">
          <label>Buscar</label>
          <input id="searchInput" type="text" placeholder="Buscar por apodo, nombre, rol, puesto, username..." />
        </div>

        <div class="field filterField">
          <label>Filtro por Rol</label>
          <select id="filterRol">
            <option value="">Todos</option>
          </select>
        </div>

        <div class="field filterField">
          <label>Filtro por Puesto</label>
          <select id="filterPuesto">
            <option value="">Todos</option>
          </select>
        </div>

        <div class="field filterField">
          <label>Filtro por Activo</label>
          <select id="filterActivo">
            <option value="">Todos</option>
            <option value="true">Activos</option>
            <option value="false">Inactivos</option>
          </select>
        </div>

        <button id="btnClear" class="btn" type="button">Limpiar</button>
      </div>

      <!-- Tabla -->
      <div class="tableCard">
        <div class="tableHead">
          <span id="resultHint" class="hint"></span>
          <div class="tableActions" style="display: flex; gap: 8px;">
            <button id="btnAdd" class="btn primary">
              <span class="btnIcon" aria-hidden="true" data-emoji="＋">
                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                  <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
              </span>
              Agregar
            </button>
            <button id="btnEdit" class="btn soft" disabled>
              <span class="btnIcon" aria-hidden="true" data-emoji="✎">
                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                  <path d="M5 19h4l10-10-4-4-10 10v4Z" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M14 5l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
              </span>
              Modificar
            </button>
            <button id="btnDelete" class="btn danger" disabled>
              <span class="btnIcon" aria-hidden="true" data-emoji="×">
                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                  <path d="M6 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  <path d="M8 7v11a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
                  <path d="M10 11v4M14 11v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
              </span>
              Eliminar
            </button>
          </div>
        </div>
        <div class="tableWrap">
          <table class="tbl">
            <thead>
              <tr>
                <th>Apodo</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Rol</th>
                <th>Puesto</th>
                <th>Asignado a</th>
                <th>Username</th>
                <th>Contraseña</th>
                <th>Activo</th>
                <th>Último acceso</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- Modal -->
    <div id="modal" class="modal hidden" aria-hidden="true">
      <div class="modalBackdrop" data-close="true"></div>
      <div class="modalCard" role="dialog" aria-modal="true">
        <div class="modalHead">
          <div class="modalTitle" id="modalTitle">Agregar personal</div>
          <button class="iconBtn" id="btnCloseModal" title="Cerrar" aria-label="Cerrar" data-emoji="×">
            <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
              <path d="M6 6l12 12M18 6l-12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>

        <form id="form" class="modalBody">
          <div class="grid2">
            <div class="field">
              <label>Apodo</label>
              <input id="fApodo" type="text" required maxlength="40" />
            </div>

            <div class="field">
              <label>Rol</label>
              <select id="fRol" required></select>
            </div>

            <div class="field">
              <label>Nombre</label>
              <input id="fNombre" type="text" required maxlength="60" />
            </div>

            <div class="field">
              <label>Apellido</label>
              <input id="fApellido" type="text" required maxlength="60" />
            </div>

            <div class="field">
              <label>Puesto</label>
              <select id="fPuesto" required></select>
            </div>

            <div class="field">
              <label>Username</label>
              <input id="fUsername" type="text" required maxlength="40" />
            </div>

            <div class="field">
              <label>Contraseña</label>
              <div class="passwordInputContainer" style="position: relative; display: flex; align-items: center; width: 100%;">
                <input id="fPassword" type="password" required maxlength="60" style="padding-right: 40px; width: 100%;" />
                <button type="button" id="btnTogglePassword" style="position: absolute; right: 10px; background: none; border: none; color: #94a3b8; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; outline: none;" title="Mostrar contraseña" aria-label="Mostrar contraseña">
                  <svg id="eyeIcon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="pointer-events: none;">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>
            </div>

            <div class="field">
              <label>Activo</label>
              <select id="fActivo">
                <option value="true">Sí</option>
                <option value="false">No</option>
              </select>
            </div>

            <div class="field full">
              <label>Último acceso</label>
              <input id="fLastAccess" type="text" placeholder="Se llena automáticamente si lo dejas vacío" />
              <div class="miniHelp">Formato sugerido: YYYY-MM-DD HH:mm</div>
            </div>
          </div>

          <div class="modalActions">
            <button type="button" id="btnDeleteModal" class="btn danger">
              <span class="btnIcon" aria-hidden="true" data-emoji="×">
                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                  <path d="M6 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  <path d="M8 7v11a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
                  <path d="M10 11v4M14 11v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
              </span>
              Eliminar
            </button>
            <button type="submit" id="btnSave" class="btn primary">
                <span class="btnIcon" aria-hidden="true" data-emoji="✓">
                  <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                    <path d="M6 12l4 4 8-8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </span>
              Guardar
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Modal de Error de Eliminación -->
    <div id="errorDeleteModal" class="modal hidden" aria-hidden="true">
      <div class="modalBackdrop" data-close="true"></div>
      <div class="modalCard" role="dialog" aria-modal="true">
        <div class="modalHead">
          <div class="modalTitle" id="errorDeleteTitle">No se puede eliminar</div>
          <button class="iconBtn" id="btnCloseErrorModal" title="Cerrar" aria-label="Cerrar" data-emoji="×">
            <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
              <path d="M6 6l12 12M18 6l-12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <div class="modalBody">
          <p id="errorDeleteMsg" style="margin: 0; color: var(--muted); line-height: 1.5;"></p>
        </div>
        <div class="modalActions">
          <button type="button" id="btnCloseErrorBtn" class="btn primary">Aceptar</button>
        </div>
      </div>
    </div>

  </main>

  <script src="js/control_personal.js?v=1.7-assignment"></script>
</body>
</html>
