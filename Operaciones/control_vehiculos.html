<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Control de Vehículos</title>
  <script src="js/api_config.js"></script>
  <script src="js/auth_check.js"></script>
  <link rel="stylesheet" href="css/control_personal.css?v=1.3" />

  <style>
    .tbl tbody tr {
      cursor: pointer;
    }

    .tbl tbody tr:hover {
      background: rgba(76, 110, 245, 0.06);
    }

    .tbl tbody tr.selected {
      background: rgba(76, 110, 245, 0.14);
    }

    .vehThumb {
      width: 54px;
      height: 38px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,.08);
      display: block;
    }

    .dropZonePreview {
      margin-top: 10px;
      width: 100%;
      max-height: 180px;
      object-fit: contain;
      border-radius: 10px;
      border: 1px solid rgba(0,0,0,.08);
      background: #fff;
      display: none;
    }

    .dropZonePreview.show {
      display: block;
    }

    .dropZoneText {
      color: rgba(11,18,32,.65);
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <button id="btnBack" class="backOnly" type="button" aria-label="Volver" title="Volver">
        <svg viewBox="0 0 24 24" focusable="false" width="20" height="20">
          <path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <div class="topActions">
      <div class="logo" aria-label="Logo SEDAM"></div>
      <div class="controlUserMenu">
        <button class="userButton" type="button" aria-haspopup="true" aria-expanded="false" style="border:none!important;background:transparent!important;box-shadow:none!important;">
          <span class="userIcon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"></path>
              <path d="M4.5 20a7.5 7.5 0 0 1 15 0"></path>
            </svg>
          </span>
          <span id="controlUserName">Admin</span>
        </button>
        <div class="userDropdown">
          <button id="btnLogout" type="button">Cerrar sesi&oacute;n</button>
        </div>
      </div>
    </div>
  </header>

  <div class="bgOrbs" aria-hidden="true">
    <span class="orb orb1"></span>
    <span class="orb orb2"></span>
    <span class="orb orb3"></span>
  </div>

  <main class="wrap">
    <section class="panel">
      <div class="panelHead">
        <div>
          <h1 class="title">Control de Vehículos</h1>
          <p class="subtitle">Administra vehiculos operativos registrados</p>
        </div>
      </div>

      <div class="filtersCard">
        <div class="field searchField">
          <label>Buscar</label>
          <input id="searchInput" type="text" placeholder="Buscar por código, alias, tipo..." />
        </div>

        <div class="field filterField">
          <label>Filtro por Tipo</label>
          <select id="filterTipo">
            <option value="">Todos</option>
            <option value="coche">coche</option>
            <option value="camioneta">camioneta</option>
            <option value="camión">camión</option>
            <option value="moto">moto</option>
            <option value="helicóptero">helicóptero</option>
            <option value="lancha">lancha</option>
            <option value="otro">otro</option>
          </select>
        </div>

        <button id="btnClear" class="btn" type="button">Limpiar</button>
      </div>

      <div class="tableCard">
        <div class="tableHead">
          <span id="resultHint" class="hint"></span>
          <div class="tableActions" style="display: flex; gap: 8px;">
            <button id="btnAdd" class="btn primary">
              <span class="btnIcon" aria-hidden="true" data-emoji="＋">
                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                  <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
              </span>
              Agregar
            </button>
            <button id="btnEdit" class="btn soft" disabled>
              <span class="btnIcon" aria-hidden="true" data-emoji="✎">
                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                  <path d="M5 19h4l10-10-4-4-10 10v4Z" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M14 5l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
              </span>
              Modificar
            </button>
            <button id="btnDelete" class="btn danger" disabled>
              <span class="btnIcon" aria-hidden="true" data-emoji="×">
                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                  <path d="M6 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  <path d="M8 7v11a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
                  <path d="M10 11v4M14 11v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
              </span>
              Eliminar
            </button>
          </div>
        </div>
        <div class="tableWrap">
          <table class="tbl">
            <thead>
              <tr>
                <th>Imagen</th>
                <th>Código interno</th>
                <th>Tipo</th>
                <th>Alias</th>
                <th>Estado</th>
                <th>Capacidad</th>
                <th>Fecha registro</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <div id="modal" class="modal hidden" aria-hidden="true">
      <div class="modalBackdrop" data-close="true"></div>

      <div class="modalCard" role="dialog" aria-modal="true">
        <div class="modalHead">
          <div class="modalTitle" id="modalTitle">Agregar vehículo</div>
          <button class="iconBtn" id="btnCloseModal" title="Cerrar" aria-label="Cerrar" data-emoji="×">
            <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
              <path d="M6 6l12 12M18 6l-12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>

        <form id="form" class="modalBody">
          <div class="grid2">
            <div class="field">
              <label>Imagen del vehículo</label>
              <div id="dropZone" class="dropZone">
                <div class="dropZoneText">Haz clic o arrastra una imagen aquí</div>
                <input id="fImagenVeh" type="file" accept="image/*" hidden />
                <img id="previewImg" class="dropZonePreview" alt="Vista previa">
              </div>
            </div>

            <div class="field">
              <label>Código interno</label>

              <div style="display:flex; gap:10px; align-items:center;">
                <select id="fCodigoPrefijo" style="max-width:140px;">
                  <option value="VT-">VT-</option>
                  <option value="AM-">AM-</option>
                  <option value="AV-">AV-</option>
                  <option value="OTRO">Otro</option>
                </select>

                <input
                  id="fCodigoOtro"
                  type="text"
                  maxlength="10"
                  placeholder="Prefijo"
                  style="display:none; max-width:120px;"
                />

                <input
                  id="fCodigoNumero"
                  type="number"
                  min="1"
                  step="1"
                  required
                  placeholder="Número"
                />
              </div>
            </div>

            <div class="field">
              <label>Tipo</label>
              <select id="fTipo" required>
                <option value="" disabled selected>Selecciona...</option>
                <option value="coche">coche</option>
                <option value="camioneta">camioneta</option>
                <option value="camión">camión</option>
                <option value="moto">moto</option>
                <option value="helicóptero">helicóptero</option>
                <option value="lancha">lancha</option>
                <option value="otro">otro</option>
              </select>
            </div>

            <div class="field">
              <label>Alias</label>
              <input id="fAlias" type="text" maxlength="50" />
            </div>

            <div class="field">
              <label>Estado</label>
              <select id="fEstado">
                <option value="DISPONIBLE">DISPONIBLE</option>
                <option value="ASIGNADO">ASIGNADO</option>
                <option value="MANTENIMIENTO">MANTENIMIENTO</option>
                <option value="FUERA DE SERVICIO">FUERA DE SERVICIO</option>
              </select>
            </div>

            <div class="field">
              <label>Capacidad</label>
              <input id="fCapacidad" type="number" min="1" step="1" />
            </div>
          </div>

          <div class="modalActions">
            <button type="button" id="btnDeleteModal" class="btn danger">
              <span class="btnIcon" aria-hidden="true" data-emoji="×">
                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                  <path d="M6 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  <path d="M8 7v11a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
                  <path d="M10 11v4M14 11v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
              </span>
              Eliminar
            </button>
            <button type="submit" id="btnSave" class="btn primary">
              <span class="btnIcon" aria-hidden="true" data-emoji="✓">
                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                  <path d="M6 12l4 4 8-8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
              Guardar
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="js/control_vehiculos.js"></script>
</body>
</html>
