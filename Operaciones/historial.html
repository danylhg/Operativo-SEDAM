<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Historial de Operaciones</title>
  <script src="js/api_config.js?v=20261002-public-api"></script>
  <script src="js/auth_check.js"></script>
  <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.139.1/Build/Cesium/Widgets/widgets.css"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Outfit:wght@600;700&display=swap"/>
  <link rel="stylesheet" href="css/historial.css?v=20261007-historial-redesign"/>
</head>
<body>
  <header class="hTopbar">
    <button id="backBtn" class="hIconBtn" type="button" aria-label="Volver al menú" title="Volver al menú">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 12H5"/><path d="m12 5-7 7 7 7"/></svg>
    </button>
    <div class="hTitleBlock">
      <strong id="historyTitle" class="hTitle">Historial de operación</strong>
      <div class="hSubtitle">
        <span id="historyCode"></span>
        <span id="historyStatusBadge" class="hStatus">Cargando</span>
      </div>
    </div>
    <span id="historyWho" class="hWho"></span>
  </header>

  <main class="hStage">
    <div id="historyMap" class="mapBox"></div>

    <aside id="historyLayers" class="hLayers" aria-label="Capas del mapa">
      <button id="historyLayersToggle" class="hLayersHead" type="button" aria-expanded="true">
        <span>Capas</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div id="historyLayerList" class="hLayerList"></div>
    </aside>
  </main>

  <aside id="historyInfoPanel" class="hPanel">
    <div class="hClock">
      <div id="historyTimeDate" class="hClockDate">--/--/----</div>
      <div id="historyCurrentTime" class="hClockTime">--:--:--</div>
      <div class="hClockMeta">
        <span>Cierre <b id="historyTotalTime">--:--:--</b></span>
        <span id="historyEventCounter">0 eventos</span>
      </div>
    </div>

    <nav class="hTabs" role="tablist">
      <button class="hTab active" type="button" role="tab" data-tab="info">Resumen</button>
      <button class="hTab" type="button" role="tab" data-tab="activity">Actividad</button>
      <button class="hTab" type="button" role="tab" data-tab="chat">Chats</button>
    </nav>

    <div class="hPane" id="infoTab">
      <div id="historyInfoContent" class="hInfo">
        <div class="hEmpty">Cargando operación...</div>
      </div>
    </div>

    <div class="hPane hidden" id="activityTab">
      <div id="eventLog" class="hActivity"></div>
    </div>

    <div class="hPane hPaneChat hidden" id="chatTab">
      <div id="historyChatList" class="hChatList"></div>

      <div id="historyChatActive" class="hChatActive hidden">
        <div class="hChatHead">
          <button id="historyChatBackBtn" class="hChatBack" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
            Chats
          </button>
          <span id="historyChatActiveTitle" class="hChatTitle"></span>
        </div>
        <div id="historyChatMessages" class="hChatMessages"></div>
      </div>
    </div>
  </aside>

  <section id="historyTimeline" class="hTimeline" aria-label="Línea de tiempo de reproducción">
    <div class="hControls">
      <button id="historyPrevEvent" class="hCtrl" type="button" title="Evento anterior" aria-label="Evento anterior">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 7 6 12l5 5V7Z"/><path d="M18 7l-5 5 5 5V7Z"/></svg>
      </button>
      <button id="historyPlayPause" class="hCtrl hCtrlPlay" type="button" aria-label="Reproducir">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7L8 5Z"/></svg>
      </button>
      <button id="historyNextEvent" class="hCtrl" type="button" title="Evento siguiente" aria-label="Evento siguiente">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13 7 5 5-5 5V7Z"/><path d="m6 7 5 5-5 5V7Z"/></svg>
      </button>

      <div id="historySpeed" class="hSpeed" role="group" aria-label="Velocidad de reproducción">
        <button type="button" data-speed="1" class="active">1x</button>
        <button type="button" data-speed="2">2x</button>
        <button type="button" data-speed="5">5x</button>
        <button type="button" data-speed="10">10x</button>
        <button type="button" data-speed="30">30x</button>
      </div>

      <div class="hTimelineClock" aria-live="off">
        <span id="historyElapsedTime">00:00:00</span>
        <i>/</i>
        <span id="historyDurationTime">00:00:00</span>
      </div>
    </div>

    <div class="hTrack">
      <div id="historyMarkers" class="hMarkers" aria-hidden="true"></div>
      <input id="historyTimeRange" class="hScrubber" type="range" min="0" max="1" value="0" step="1" aria-label="Posición en la línea de tiempo"/>
    </div>
  </section>

  <script src="https://cesium.com/downloads/cesiumjs/releases/1.139.1/Build/Cesium/Cesium.js"></script>
  <script src="https://unpkg.com/milsymbol@2.2.0/dist/milsymbol.js"></script>
  <script type="module" src="js/historial/main.js?v=20261007-historial-redesign"></script>
</body>
</html>
