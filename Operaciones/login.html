<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login - Sistema de Operaciones</title>
  <link rel="stylesheet" href="css/login.css?v=1.3-password" />
  <script src="js/api_config.js?v=20261002-public-api"></script>
</head>
<body>
  <main class="wrap">
    <section class="card" aria-labelledby="loginTitle">
      <div class="icon">
        <div class="logo-ring">
          <img src="img/logo_sedam_sinfondo.png" alt="Logo SEDAM" class="logoSedam" onerror="this.hidden=true; this.nextElementSibling.hidden=false;" />
          <span class="logoFallback" hidden aria-hidden="true">SEDAM</span>
        </div>
      </div>

      <h1 id="loginTitle"><span>Sistema de</span><span>Operaciones</span></h1>

      <div id="loginPanel">
      <p class="sub">Ingresa tus credenciales para continuar</p>

      <div class="field">
        <label for="username">Usuario</label>
        <input id="username" name="username" autocomplete="username" />
      </div>

      <div class="field">
        <label for="password">Contrase&ntilde;a</label>
        <div class="passwordField">
          <input id="password" name="password" type="password" autocomplete="current-password" />
          <button type="button" id="btnTogglePassword" class="passwordToggle" title="Mostrar contraseña" aria-label="Mostrar contraseña"></button>
        </div>
      </div>

      <button id="btnLogin" type="button">Iniciar sesi&oacute;n</button>
      <p id="msg" class="msg" role="status" aria-live="polite"></p>
      <button type="button" id="btnShowChangePassword" class="linkBtn">Cambiar contrase&ntilde;a</button>
      </div>

      <!-- Elegir o cambiar contraseña. Con código de acceso (cuenta nueva,
           vigencia de 30 días) o con la contraseña actual. -->
      <div id="passwordPanel" hidden>
        <p class="sub" id="pwSubtitle">Cambia tu contrase&ntilde;a</p>
        <p class="pwInfo" id="pwInfo" hidden></p>

        <div class="field">
          <label for="pwUsername">Usuario</label>
          <input id="pwUsername" autocomplete="username" />
        </div>

        <div class="field">
          <label for="pwActual" id="pwActualLabel">Contrase&ntilde;a actual</label>
          <div class="passwordField">
            <input id="pwActual" type="password" autocomplete="current-password" />
            <button type="button" class="passwordToggle" title="Mostrar contraseña" aria-label="Mostrar contraseña"></button>
          </div>
        </div>

        <div class="field">
          <label for="pwNueva">Nueva contrase&ntilde;a</label>
          <div class="passwordField">
            <input id="pwNueva" type="password" autocomplete="new-password" />
            <button type="button" class="passwordToggle" title="Mostrar contraseña" aria-label="Mostrar contraseña"></button>
          </div>
        </div>

        <div class="field">
          <label for="pwConfirmar">Confirmar contrase&ntilde;a</label>
          <div class="passwordField">
            <input id="pwConfirmar" type="password" autocomplete="new-password" />
            <button type="button" class="passwordToggle" title="Mostrar contraseña" aria-label="Mostrar contraseña"></button>
          </div>
        </div>

        <p class="pwHint">M&iacute;nimo 8 caracteres, con letras y n&uacute;meros.</p>

        <button id="btnSavePassword" type="button">Guardar contrase&ntilde;a</button>
        <p id="pwMsg" class="msg" role="status" aria-live="polite"></p>
        <button type="button" id="btnBackToLogin" class="linkBtn">Volver al inicio de sesi&oacute;n</button>
      </div>
    </section>
  </main>

  <script src="js/login.js?v=1.4-password-ojo"></script>
  <script>
    // Ojo para mostrar u ocultar la contraseña (en todos los campos .passwordField).
    (function () {
      var svgOpen = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
      var eye = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
      var eyeOff = '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';

      function setState(input, btn, show) {
        input.type = show ? "text" : "password";
        btn.innerHTML = svgOpen + (show ? eyeOff : eye) + "</svg>";
        btn.title = show ? "Ocultar contraseña" : "Mostrar contraseña";
        btn.setAttribute("aria-label", btn.title);
      }

      document.querySelectorAll(".passwordField").forEach(function (field) {
        var input = field.querySelector("input");
        var btn = field.querySelector(".passwordToggle");
        if (!input || !btn) return;
        setState(input, btn, false);
        btn.addEventListener("click", function () {
          setState(input, btn, input.type === "password");
          input.focus();
        });
      });

      // Al cambiar de panel, vuelve a ocultar las contraseñas.
      ["btnShowChangePassword", "btnBackToLogin"].forEach(function (id) {
        var el = document.getElementById(id);
        if (!el) return;
        el.addEventListener("click", function () {
          document.querySelectorAll(".passwordField").forEach(function (field) {
            var input = field.querySelector("input");
            var btn = field.querySelector(".passwordToggle");
            if (input && btn) setState(input, btn, false);
          });
        });
      });
    })();
  </script>
</body>
</html>
