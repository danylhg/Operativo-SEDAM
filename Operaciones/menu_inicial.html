<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Men&uacute; inicial</title>
  <script src="js/api_config.js"></script>
  <script src="js/auth_check.js"></script>
  <link rel="stylesheet" href="css/menu_inicial.css?v=1.3" />
</head>

<body>
  <header class="topbar">
    <div class="brand" aria-hidden="true"></div>

    <div class="headerRight">
      <img src="img/logo_sedam_sinfondo.png" alt="Logo SEDAM" class="logo" />

      <div class="userMenu">
        <button id="btnUserMenu" class="userButton" type="button" aria-haspopup="true" aria-expanded="false" style="border:none!important;background:transparent!important;box-shadow:none!important;">
          <span class="userIcon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"></path>
              <path d="M4.5 20a7.5 7.5 0 0 1 15 0"></path>
            </svg>
          </span>
          <span id="userName">Invitado</span>
        </button>
        <div id="userDropdown" class="userDropdown hidden">
          <button id="btnLogout" type="button">Cerrar sesi&oacute;n</button>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1 class="title">Men&uacute; de Operaciones</h1>
      <p class="subtitle">Seleccione una opci&oacute;n para continuar</p>

      <div class="card">
        <div class="actions">
          <button id="btnCreate" class="btn primary">
            <span class="btnIcon" aria-hidden="true" data-emoji="＋">
              <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </span>
            Crear operaci&oacute;n
          </button>

          <button id="btnSelect" class="btn soft">
            <span class="btnIcon" aria-hidden="true" data-emoji="≡">
              <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </span>
            Seleccionar operaci&oacute;n
          </button>

          <button id="btnPersonal" class="btn soft">
            Sistema de control
          </button>
        </div>

        <div id="submenuControl" class="controlGrid hidden">
          <button id="btnControlPersonal" class="controlItem" type="button">
            <span class="controlItemIcon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"></path>
                <path d="M4 20a8 8 0 0 1 16 0"></path>
              </svg>
            </span>
            <span class="controlItemLabel">Personal</span>
          </button>
          <button id="btnControlVehiculos" class="controlItem" type="button">
            <span class="controlItemIcon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path d="M4 15h16l-1.4-5.2A2 2 0 0 0 16.7 8H7.3a2 2 0 0 0-1.9 1.8L4 15Z"></path>
                <path d="M7 15v2"></path>
                <path d="M17 15v2"></path>
                <path d="M8 12h8"></path>
              </svg>
            </span>
            <span class="controlItemLabel">Veh&iacute;culos</span>
          </button>
          <button id="btnControlEquipos" class="controlItem" type="button">
            <span class="controlItemIcon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"></path>
                <path d="M12 12 4.7 7.7"></path>
                <path d="M12 12v8.5"></path>
                <path d="m12 12 7.3-4.3"></path>
              </svg>
            </span>
            <span class="controlItemLabel">Equipos</span>
          </button>
          <button id="btnControlDispositivos" class="controlItem" type="button">
            <span class="controlItemIcon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path d="M8 3h8a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"></path>
                <path d="M10 18h4"></path>
              </svg>
            </span>
            <span class="controlItemLabel">Dispositivos</span>
          </button>
        </div>

        <div id="opsList" class="ops hidden">
          <div class="opsHead">
            <div>
              <span class="opsTitle">Operaciones existentes</span>
            </div>
          </div>

          <div class="opsFilters">
            <div class="opsFilterRow">
              <select id="searchOpAssignment" class="opFilterInput" aria-label="Filtrar por asignaci&oacute;n">
                <option value="todas">Todas las operaciones</option>
                <option value="asignadas">Asignadas a m&iacute;</option>
              </select>
              <select id="searchOpState" class="opFilterInput" aria-label="Filtrar por estado">
                <option value="todas">Todos los estados</option>
                <option value="activa">Activas</option>
                <option value="planificada">Planificadas</option>
                <option value="cerrada">Cerradas</option>
                <option value="cancelada">Canceladas</option>
              </select>
            </div>
            <div class="opsFilterRow">
              <input type="text" id="searchOpName" placeholder="Buscar por nombre..." class="opFilterInput" />
              <input type="date" id="searchOpDate" class="opFilterInput" />
            </div>
          </div>

          <ul id="opsUl" class="opsUl"></ul>
        </div>
      </div>
    </section>
  </main>

  <script src="js/menu_inicial.js"></script>
</body>

</html>
