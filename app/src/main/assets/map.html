    // =========================
    // Puntos de InterÃ©s (POI)
    // =========================
    const poiEntities = new Map(); // id_poi â†’ entity
    const poiHeadingEntities = new Map();
    const POI_HEADING_LENGTH_M = 42;
    function poiDirectionArrowImage(headingDeg) {
      // El primer tramo conecta con el Blanco; el segundo y su punta marcan
      // el rumbo. Es intencionalmente un gráfico de píxeles para que se vea
      // a cualquier nivel de zoom.
      const radians = Cesium.Math.toRadians(headingDeg);
      const pointsUpward = headingDeg <= 45 || headingDeg >= 315;
      // Hacia el norte la flecha sale de la parte superior del símbolo. Evita
      // que el conector vertical y la punta queden superpuestos.
      const startX = 40;
      const startY = pointsUpward ? 78 : 1;
      const elbowX = 40;
      const elbowY = pointsUpward ? 78 : 36;
      const length = pointsUpward ? 35 : 29;
      const tipX = elbowX + Math.sin(radians) * length;
      const tipY = elbowY - Math.cos(radians) * length;
      const headLength = 11;
      const leftX = tipX - Math.sin(radians - Math.PI / 6) * headLength;
      const leftY = tipY + Math.cos(radians - Math.PI / 6) * headLength;
      const rightX = tipX - Math.sin(radians + Math.PI / 6) * headLength;
      const rightY = tipY + Math.cos(radians + Math.PI / 6) * headLength;
      const n = (value) => Number(value).toFixed(1);
      const connector = pointsUpward
        ? 'M' + startX + ' ' + startY + 'L' + n(tipX) + ' ' + n(tipY)
        : 'M' + startX + ' ' + startY + 'V' + elbowY + 'L' + n(tipX) + ' ' + n(tipY);
      const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">' +
        '<path d="' + connector +
        'M' + n(tipX) + ' ' + n(tipY) + 'L' + n(leftX) + ' ' + n(leftY) +
        'M' + n(tipX) + ' ' + n(tipY) + 'L' + n(rightX) + ' ' + n(rightY) +
        '" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      return {
        image: 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg),
        pointsUpward: pointsUpward
      };
    }
    function blancoLabelOffset(headingDeg, useBillboard) {
      if (!useBillboard) return new Cesium.Cartesian2(-38, -12);
      // La etiqueta queda fuera del recorrido de la flecha. Para rumbo norte
      // se coloca debajo del símbolo, dejando libre la flecha superior.
      if (headingDeg <= 45 || headingDeg >= 315) return new Cesium.Cartesian2(0, 22);
      if (headingDeg <= 135) return new Cesium.Cartesian2(-42, -46);
      if (headingDeg <= 225) return new Cesium.Cartesian2(0, -48);
      return new Cesium.Cartesian2(42, -46);
    }
    function updatePoiHeadingArrow(entityId, lat, lon, headingDeg, color) {
      if (!viewer || !Number.isFinite(lat) || !Number.isFinite(lon) || !Number.isFinite(headingDeg)) return;
      const arrowGraphic = poiDirectionArrowImage(headingDeg);
      const current = poiHeadingEntities.get(entityId);
      if (current) {
        current.billboard.image = arrowGraphic.image;
        current.billboard.verticalOrigin = arrowGraphic.pointsUpward
          ? Cesium.VerticalOrigin.BOTTOM : Cesium.VerticalOrigin.TOP;
        current.billboard.pixelOffset = arrowGraphic.pointsUpward
          ? new Cesium.Cartesian2(0, -28) : Cesium.Cartesian2.ZERO;
        return;
      }
      const arrow = viewer.entities.add({
        id: entityId + '_heading',
        position: new Cesium.CallbackProperty(function () {
          const target = poiEntities.get(entityId);
          if (!target || !target.position) return Cesium.Cartesian3.fromDegrees(lon, lat);
          return target.position.getValue
            ? target.position.getValue(viewer.clock.currentTime)
            : target.position;
        }, false),
        billboard: {
          image: arrowGraphic.image,
          horizontalOrigin: Cesium.HorizontalOrigin.CENTER,
          verticalOrigin: arrowGraphic.pointsUpward
            ? Cesium.VerticalOrigin.BOTTOM : Cesium.VerticalOrigin.TOP,
          pixelOffset: arrowGraphic.pointsUpward
            ? new Cesium.Cartesian2(0, -28) : Cesium.Cartesian2.ZERO,
          width: 80,
          height: 80,
          disableDepthTestDistance: Number.POSITIVE_INFINITY
        },
        properties: { tacticalType: 'poi-heading', poiId: entityId }
      });
      poiHeadingEntities.set(entityId, arrow);
    }
    const poiMotionStates = new Map();
    function updateMovingPois() {
      const now = Date.now();
      poiMotionStates.forEach(function (motion, entityId) {
        const entity = poiEntities.get(entityId);
        if (!entity || !viewer) return;
        const elapsedSeconds = Math.max(0, (now - motion.startedAt) / 1000);
        const distanceM = motion.speedKmh / 3.6 * elapsedSeconds;
        const headingRad = Cesium.Math.toRadians(motion.headingDeg);
        const northM = Math.cos(headingRad) * distanceM;
        const eastM = Math.sin(headingRad) * distanceM;
        const lat = motion.lat + northM / 111320;
        const lon = motion.lon + eastM / (111320 * Math.max(0.1, Math.cos(Cesium.Math.toRadians(motion.lat))));
        entity.position = Cesium.Cartesian3.fromDegrees(lon, lat);
        if (motion.showHeadingArrow) {
          updatePoiHeadingArrow(entityId, lat, lon, motion.headingDeg, motion.color);
        }
        if (entity.properties) {
          entity.properties.poiLat = lat;
          entity.properties.poiLon = lon;
        }
      });

    function getMilSymbolImage(sidc) {
      try {
        if (!sidc || typeof ms === 'undefined' || typeof ms.Symbol !== 'function') return null;
        const waypointColors = { F: '#F7FAFF', H: '#FF3347', N: '#00F53D', U: '#FFF000' };
        const isWaypoint = String(sidc).startsWith('G');
        const symbol = new ms.Symbol(sidc, isWaypoint ? {
          size: 500,
          monoColor: waypointColors[String(sidc).charAt(1)] || '#FFF000',
          fill: false
        } : { size: 500, colorMode: 'Light' });
        if (typeof symbol.isValid === 'function' && symbol.isValid() === false) return null;
        if (typeof symbol.isValid === 'function' && symbol.isValid() === false) return null;
        if (typeof symbol.asSVG !== 'function') return null;
        const svg = symbol.asSVG();
        if (!svg || />\s*\?\s*</.test(svg)) return null;
        return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
      } catch (e) {
        console.error('[POI][WEB] Error creando milsymbol: ' + e.message);
        return null;
      }
    }

      if (defaultList.some(function (d) { return d.toUpperCase() === upper; })) {
        return fallbackIfLabel || '';
      }
      return nameStr;
    }

        const headingDeg = hasHeading ? ((parsedHeading % 360) + 360) % 360 : 0;
        // En Android los Blancos se guardan como MIL; aceptamos tambiÃ©n el
        // nombre explÃ­cito para los datos recibidos de versiones anteriores.

        const isSafeImageSource = (value) => {
          if (!value || typeof value !== 'string' || value === 'null' || value.endsWith('/null')) return false;
          if (/\s/.test(value) || value.length > 2048) return false;
          if (value.startsWith('data:image/')) return true;

        const useImageSrc = isSafeImageSource(normalizedIconoSrc) &&

        const billboardImage = milImage || (useImageSrc ? normalizedIconoSrc : null);

    function renderOperationZoneRose(zoneObj) {
      if (!viewer || !zoneObj || !Array.isArray(zoneObj.points)) return;
      const bounds = operationGridBounds(zoneObj.points);
      if (!bounds) return;

      const centerLat = (bounds.minLat + bounds.maxLat) / 2;
      const centerLon = (bounds.minLon + bounds.maxLon) / 2;

      function cardinalInset(direction) {
        return new Cesium.CallbackProperty(function () {
          const heading = viewer.camera.heading;
          const sin = Math.sin(heading);
          const cos = Math.cos(heading);
          const inset = 18;
          if (direction === 'N') return new Cesium.Cartesian2(-sin * inset, -cos * inset);
          if (direction === 'S') return new Cesium.Cartesian2(sin * inset, cos * inset);
          if (direction === 'E') return new Cesium.Cartesian2(cos * inset, -sin * inset);
          return new Cesium.Cartesian2(-cos * inset, sin * inset);
        }, false);
      }

      [
        { text: 'N', lat: bounds.maxLat, lon: centerLon },
        { text: 'S', lat: bounds.minLat, lon: centerLon },
        { text: 'E', lat: centerLat, lon: bounds.maxLon },
        { text: 'O', lat: centerLat, lon: bounds.minLon }
      ].forEach(function (label) {
        operationZoneRoseEntities.push(viewer.entities.add({
          position: Cesium.Cartesian3.fromDegrees(label.lon, label.lat),
          label: {
            text: label.text,
            font: 'bold 24px monospace',
            fillColor: Cesium.Color.fromCssColorString('rgba(0,0,0,0.92)'),
            outlineColor: Cesium.Color.WHITE.withAlpha(0.82),
            outlineWidth: 3,
            style: Cesium.LabelStyle.FILL_AND_OUTLINE,
            pixelOffset: cardinalInset(label.text),
            heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
            disableDepthTestDistance: Number.POSITIVE_INFINITY,
            scaleByDistance: SCALE_BY_DIST
          }
        }));
      });
    }

    function operationGridDefaultName(index) {
      const phonetic = [
        'ALFA', 'BRAVO', 'CHARLIE', 'DELTA', 'ECHO', 'FOXTROT', 'GOLF', 'HOTEL',
        'INDIA', 'JULIETT', 'KILO', 'LIMA', 'MIKE', 'NOVEMBER', 'OSCAR', 'PAPA',
        'QUEBEC', 'ROMEO', 'SIERRA', 'TANGO', 'UNIFORM', 'VICTOR', 'WHISKEY', 'X-RAY',
        'YANKEE', 'ZULU'
      ];
      const baseName = phonetic[index % phonetic.length] || ('Q' + (index + 1));
      const cycle = Math.floor(index / phonetic.length);
      return cycle > 0 ? (baseName + '-' + (cycle + 1)) : baseName;
    }

    function operationGridBounds(points) {
      let minLat = Infinity;
      let maxLat = -Infinity;
      let minLon = Infinity;
      let maxLon = -Infinity;

      points.forEach(function (point) {
        const lat = Number(point.lat);
        const lon = Number(point.lon);
        if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;
        minLat = Math.min(minLat, lat);
        maxLat = Math.max(maxLat, lat);
        minLon = Math.min(minLon, lon);
        maxLon = Math.max(maxLon, lon);
      });

      if (!Number.isFinite(minLat) || !Number.isFinite(maxLat) ||
          !Number.isFinite(minLon) || !Number.isFinite(maxLon)) return null;

      return { minLat, maxLat, minLon, maxLon };
    }

    function renderOperationGrid(gridObj) {
      try {
        if (!viewer || !gridObj) return;

        clearOperationGrid();

        const size = String(gridObj.size || '').toLowerCase();
        const match = size.match(/^(\d+)x(\d+)$/);
        const rows = Number(gridObj.rows || (match && match[1]));
        const cols = Number(gridObj.cols || (match && match[2]));
        if (!Number.isFinite(rows) || !Number.isFinite(cols) || rows <= 0 || cols <= 0) return;

        let bounds = null;
        if (operationZoneForGrid && Array.isArray(operationZoneForGrid.points) && operationZoneForGrid.points.length >= 3) {
          bounds = operationGridBounds(operationZoneForGrid.points);
        }
        if (!bounds) {
          const rect = viewer.camera.computeViewRectangle();
          if (rect) {
            bounds = {
              minLat: Cesium.Math.toDegrees(rect.south),
              maxLat: Cesium.Math.toDegrees(rect.north),
              minLon: Cesium.Math.toDegrees(rect.west),
              maxLon: Cesium.Math.toDegrees(rect.east)
            };
          }
        }
        if (!bounds) return;

        const latStep = (bounds.maxLat - bounds.minLat) / rows;
        const lonStep = (bounds.maxLon - bounds.minLon) / cols;
        if (!Number.isFinite(latStep) || !Number.isFinite(lonStep) || latStep <= 0 || lonStep <= 0) return;

        const colors = [
          '#FFA000', '#1E88E5', '#E53935', '#00897B', '#8E24AA',
          '#FB8C00', '#D81B60', '#039BE5', '#43A047', '#FDD835'
        ].map(function (color) { return Cesium.Color.fromCssColorString(color); });

        let colorIndex = 0;

        // Líneas verticales internas (en medio)
        for (let col = 1; col < cols; col += 1) {
          const lon = bounds.minLon + col * lonStep;
          const color = colors[colorIndex % colors.length];
          colorIndex += 1;
          operationGridEntities.push(viewer.entities.add({
            polyline: {
              positions: Cesium.Cartesian3.fromDegreesArray([lon, bounds.minLat, lon, bounds.maxLat]),
              width: 2.5,
              material: new Cesium.PolylineDashMaterialProperty({
                color: color.withAlpha(0.9),
                dashLength: 14
              }),
              clampToGround: false
            }
          }));
        }

        // Líneas horizontales internas (en medio)
        for (let row = 1; row < rows; row += 1) {
          const lat = bounds.minLat + row * latStep;
          const color = colors[colorIndex % colors.length];
          colorIndex += 1;
          operationGridEntities.push(viewer.entities.add({
            polyline: {
              positions: Cesium.Cartesian3.fromDegreesArray([bounds.minLon, lat, bounds.maxLon, lat]),
              width: 2.5,
              material: new Cesium.PolylineDashMaterialProperty({
                color: color.withAlpha(0.9),
                dashLength: 14
              }),
              clampToGround: false
            }
          }));
        }

        const names = Array.isArray(gridObj.names)
          ? gridObj.names
          : (Array.isArray(gridObj.nombres) ? gridObj.nombres : []);

        let index = 0;
        for (let row = 0; row < rows; row += 1) {
          const latTop = bounds.maxLat - row * latStep;
          const latBottom = bounds.maxLat - (row + 1) * latStep;

          for (let col = 0; col < cols; col += 1) {
            const lonLeft = bounds.minLon + col * lonStep;

        if (ent) {
          viewer.entities.remove(ent);
          drawingEntities.delete(localId);
        }
      } catch (e) {
        console.error('Error removeDrawingFromMap: ' + e.message);
      }
    };

    function tacticalRouteCoordinates(geometry) {
      if (!geometry) return [];
      let geo = geometry;
      if (typeof geo === 'string') {
        try { geo = JSON.parse(geo); } catch (_) { return []; }
      }

      if (geo.type === 'LineString' && Array.isArray(geo.coordinates)) {
        return geo.coordinates;
      }

      if (geo.type === 'MultiLineString' && Array.isArray(geo.coordinates)) {
        var merged = [];
        geo.coordinates.forEach(function (line) {
          if (Array.isArray(line)) merged = merged.concat(line);
        });
        return merged;
      }

      return [];
    }

    window.drawTacticalRoute = function (rutaObj) {
      try {
        if (!viewer || !rutaObj) return;

        const id = Number(rutaObj.id_ruta || rutaObj.id_elemento);
        if (!Number.isFinite(id) || id <= 0) return;

        const coords = tacticalRouteCoordinates(rutaObj.geometria || rutaObj.geometry || rutaObj.geojson)
          .map(function (coord) {
            return Cesium.Cartesian3.fromDegrees(Number(coord[0]), Number(coord[1]));
          });
        if (coords.length < 2) return;

        if (tacticalRoutes.has(id)) {
          viewer.entities.remove(tacticalRoutes.get(id));
          tacticalRoutes.delete(id);
        }

        const color = (rutaObj.color && String(rutaObj.color).startsWith('#')) ? rutaObj.color : '#1E90FF';
        const entity = viewer.entities.add({
          id: 'ruta_operacion_' + id,
          name: rutaObj.nombre || 'Linea tactica',
          polyline: {
            positions: coords,
            width: Number(rutaObj.grosor || rutaObj.width || 4),
            material: Cesium.Color.fromCssColorString(color),
            clampToGround: false
          },
          properties: {
            tacticalType: 'tactical-route',
            id_ruta: id
          }
        });

        tacticalRoutes.set(id, entity);
      } catch (e) {
        console.error('Error drawTacticalRoute: ' + e.message);
      }
    };

    window.loadTacticalRoutes = function (routesArray, replace) {
      try {
        if (!Array.isArray(routesArray)) return;
        const incomingIds = new Set(
          routesArray
            .map(route => Number(route && (route.id_ruta || route.id_elemento)))
            .filter(id => Number.isFinite(id) && id > 0)
        );
        if (replace) {
          Array.from(tacticalRoutes.keys()).forEach(function (id) {
            if (!incomingIds.has(Number(id))) {
              removeTacticalRouteFromMap(id);
            }
          });
        }
        routesArray.forEach(function (route) {
          drawTacticalRoute(route);
        });
      } catch (e) {
        console.error('Error loadTacticalRoutes: ' + e.message);
      }
    };

    window.removeTacticalRouteFromMap = function (idRuta) {
      try {
        const id = Number(idRuta);
        const entity = tacticalRoutes.get(id);
        if (entity) {
          viewer.entities.remove(entity);
          tacticalRoutes.delete(id);
        }
      } catch (e) {
        console.error('Error removeTacticalRouteFromMap: ' + e.message);
      }
    };

    window.removeDrawingByLocalId = function (localId) {
      try {
        var ent = drawingEntities.get(localId);
        if (ent) {
          viewer.entities.remove(ent);
          drawingEntities.delete(localId);
        }
      } catch (e) {
        console.error('Error removeDrawingByLocalId: ' + e.message);
      }
    };

    // Herramientas locales del menú móvil. Se mantienen separadas de los
    // objetos operativos para que una medición nunca se envíe al backend.
    let mobileToolHandler = null;
    let mobileToolPoints = [];
    const mobileToolEntities = [];
    let mobileToolGroupSequence = 0;
    let activeMobileToolGroup = null;
    let selectedMobileToolGroup = null;

    function mobileToolGroupForEntity(entity) {
      return entity && entity.mobileToolGroup ? entity.mobileToolGroup : null;
    }

    function getMobileToolGroupAtPosition(position) {
      if (!viewer || !position) return null;
      const picked = viewer.scene.pick(position);
      const pickedEntity = picked && picked.id;
      const pickedGroup = mobileToolGroupForEntity(pickedEntity);
      if (pickedGroup) return pickedGroup;

      // Fallback para líneas: algunas versiones de Cesium no devuelven la
      // entidad de un polyline al tocarla directamente.
      let closestGroup = null;
      let closestLineDistance = 14;
      mobileToolEntities.forEach(function (entity) {
        const group = mobileToolGroupForEntity(entity);
        if (!group) return;
        if (!entity.polyline || !entity.polyline.positions) return;
        const positions = entity.polyline.positions.getValue
          ? entity.polyline.positions.getValue(viewer.clock.currentTime)
          : entity.polyline.positions;
        if (!positions || positions.length < 2) return;
        for (let index = 1; index < positions.length; index += 1) {
          const start = Cesium.SceneTransforms.worldToWindowCoordinates(viewer.scene, positions[index - 1]);
          const end = Cesium.SceneTransforms.worldToWindowCoordinates(viewer.scene, positions[index]);
          if (!start || !end) continue;
          const dx = end.x - start.x;
          const dy = end.y - start.y;
          const lengthSquared = dx * dx + dy * dy;
          if (lengthSquared <= 0) continue;
          const factor = Math.max(0, Math.min(1, ((position.x - start.x) * dx + (position.y - start.y) * dy) / lengthSquared));
          const distance = Math.hypot(position.x - (start.x + factor * dx), position.y - (start.y + factor * dy));
          if (distance < closestLineDistance) {
            closestLineDistance = distance;
            closestGroup = group;
          }
        }
      });
      return closestGroup;
    }

    window.selectMobileToolGroup = function (groupId) {
      selectedMobileToolGroup = groupId || null;
      if (typeof Android !== 'undefined') {
        if (selectedMobileToolGroup && typeof Android.onMobileToolSelected === 'function') {
          Android.onMobileToolSelected();
        } else if (!selectedMobileToolGroup && typeof Android.onMobileToolSelectionCleared === 'function') {
          Android.onMobileToolSelectionCleared();
        }
      }
    };

    window.deleteSelectedMobileTool = function () {
      if (!selectedMobileToolGroup) return;
      for (let i = mobileToolEntities.length - 1; i >= 0; i -= 1) {
        const entity = mobileToolEntities[i];
        if (entity && entity.mobileToolGroup === selectedMobileToolGroup) {
          viewer.entities.remove(entity);
          mobileToolEntities.splice(i, 1);
        }
      }
      window.selectMobileToolGroup(null);
    };

    function mobilePick(position) {
      if (!viewer || !position) return null;
      try {
        const cartesian = viewer.camera.pickEllipsoid(position, viewer.scene.globe.ellipsoid);
        if (!cartesian) return null;
        const cartographic = Cesium.Cartographic.fromCartesian(cartesian);
        return {
          cartesian: cartesian,
          lon: Cesium.Math.toDegrees(cartographic.longitude),
          lat: Cesium.Math.toDegrees(cartographic.latitude)
        };
      } catch (e) {
        console.error("Error en mobilePick: " + e.message);
        return null;
      }
    }

    function mobileDistance(a, b) {
      try {
        const geodesic = new Cesium.EllipsoidGeodesic(
          Cesium.Cartographic.fromDegrees(a.lon, a.lat),
          Cesium.Cartographic.fromDegrees(b.lon, b.lat)
        );
        return geodesic.surfaceDistance || 0;
      } catch (e) {
        return 0;
      }
    }

    function mobileArea(points) {
      try {
        const centerLat = points.reduce((sum, p) => sum + p.lat, 0) / points.length;
        const metersLon = 111320 * Math.cos(Cesium.Math.toRadians(centerLat));
        const metersLat = 110540;
        let sum = 0;
        points.forEach((p, index) => {
          const next = points[(index + 1) % points.length];
          sum += (p.lon * metersLon) * (next.lat * metersLat) - (next.lon * metersLon) * (p.lat * metersLat);
        });
        return Math.abs(sum) / 2;
      } catch (e) {
        return 0;
      }
    }

    function addMobileEntity(options) {
      try {
        const entity = viewer.entities.add(options);
        entity.mobileToolGroup = activeMobileToolGroup;
        mobileToolEntities.push(entity);
        return entity;
      } catch (e) {
        console.error("Error al agregar entidad movil: " + e.message);
        return null;
      }
    }

    function finishMobileTool(mode) {
      try {
        if (!activeMobileToolGroup) {
          activeMobileToolGroup = 'mobile-tool-' + (++mobileToolGroupSequence);
        }
        const cyan = Cesium.Color.fromCssColorString('#26D9E8');
        const fill = cyan.withAlpha(0.22);
        if ((mode === 'distance' || mode === 'line') && mobileToolPoints.length >= 2) {
          const distance = mobileDistance(mobileToolPoints[0], mobileToolPoints[1]);
          addMobileEntity({
            polyline: {
              positions: mobileToolPoints.map(p => p.cartesian),
              width: 4,
              material: cyan,
              arcType: Cesium.ArcType.GEODESIC
            }
          });
          if (mode === 'distance') {
            const distFormatted = distance >= 1000
              ? (distance / 1000).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' km'
              : Math.round(distance).toLocaleString('es-MX') + ' m';
            addMobileEntity({
              position: mobileToolPoints[1].cartesian,
              label: {
                text: distFormatted,
                font: 'bold 15px sans-serif',
                fillColor: Cesium.Color.WHITE,
                showBackground: true,
                backgroundColor: Cesium.Color.fromCssColorString('#0B192C').withAlpha(0.92),
                backgroundPadding: new Cesium.Cartesian2(10, 6),
                pixelOffset: new Cesium.Cartesian2(0, -32),
                disableDepthTestDistance: Number.POSITIVE_INFINITY
              }
            });
          }
        } else if ((mode === 'area' || mode === 'zone') && mobileToolPoints.length >= 3) {
          const positions = mobileToolPoints.map(p => p.cartesian);
          addMobileEntity({
            polygon: {
              hierarchy: new Cesium.PolygonHierarchy(positions),
              material: fill,
              outline: true,
              outlineColor: cyan
            }
          });
          if (mode === 'area') {
            const area = mobileArea(mobileToolPoints);
            const centerLat = mobileToolPoints.reduce((sum, p) => sum + p.lat, 0) / mobileToolPoints.length;
            const centerLon = mobileToolPoints.reduce((sum, p) => sum + p.lon, 0) / mobileToolPoints.length;
            const centerCartesian = Cesium.Cartesian3.fromDegrees(centerLon, centerLat);
            const areaFormatted = area >= 1000000
              ? (area / 1000000).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' km²'
              : Math.round(area).toLocaleString('es-MX') + ' m²';
            addMobileEntity({
              position: centerCartesian,
              label: {
                text: areaFormatted,
                font: 'bold 15px sans-serif',
                fillColor: Cesium.Color.WHITE,
                showBackground: true,
                backgroundColor: Cesium.Color.fromCssColorString('#0B192C').withAlpha(0.92),
                backgroundPadding: new Cesium.Cartesian2(10, 6),
                disableDepthTestDistance: Number.POSITIVE_INFINITY
              }
            });
          }
        } else if (mode === 'rectangle' && mobileToolPoints.length >= 2) {
          const a = mobileToolPoints[0], b = mobileToolPoints[1];
          addMobileEntity({
            rectangle: {
              coordinates: Cesium.Rectangle.fromDegrees(
                Math.min(a.lon, b.lon), Math.min(a.lat, b.lat),
                Math.max(a.lon, b.lon), Math.max(a.lat, b.lat)
              ),
              material: fill,
              outline: true,
              outlineColor: cyan
            }
          });
        } else if (mode === 'radius' && mobileToolPoints.length >= 2) {
          const radius = mobileDistance(mobileToolPoints[0], mobileToolPoints[1]);
          const radFormatted = radius >= 1000
            ? (radius / 1000).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' km'
            : Math.round(radius).toLocaleString('es-MX') + ' m';
          addMobileEntity({
            position: mobileToolPoints[0].cartesian,
            ellipse: {
              semiMajorAxis: radius,
              semiMinorAxis: radius,
              material: fill,
              outline: true,
              outlineColor: cyan
            },
            label: {
              text: radFormatted,
              font: 'bold 15px sans-serif',
              fillColor: Cesium.Color.WHITE,
              showBackground: true,
              backgroundColor: Cesium.Color.fromCssColorString('#0B192C').withAlpha(0.92),
              backgroundPadding: new Cesium.Cartesian2(10, 6),
              disableDepthTestDistance: Number.POSITIVE_INFINITY
            }
          });
        }
      } catch (err) {
        console.error("Error finalizando herramienta movil: " + err.message);
      } finally {
        mobileToolPoints = [];
        if (mobileToolHandler) {
          mobileToolHandler.destroy();
          mobileToolHandler = null;
        }
      }
    }

    window.startMobileMapTool = function (mode) {
      mobileToolPoints = [];
      activeMobileToolGroup = 'mobile-tool-' + (++mobileToolGroupSequence);
      window.selectMobileToolGroup(null);
      if (mobileToolHandler) {
        mobileToolHandler.destroy();
        mobileToolHandler = null;
      }

      if (mode === 'radius') {
        const cyan = Cesium.Color.fromCssColorString('#26D9E8');
        const fill = cyan.withAlpha(0.22);
        let centerPoint = null;
        let currentRadius = 1;
        let isDraggingRadius = false;
        let dynamicCircleEntity = null;
        const controller = viewer.scene.screenSpaceCameraController;

        mobileToolHandler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);

        function updateRadiusFromPosition(position) {
          if (!centerPoint || !position) return;
          const endPoint = mobilePick(position);
          if (!endPoint) return;
          currentRadius = Math.max(1, mobileDistance(centerPoint, endPoint));
        }

        function movementPosition(movement) {
          return movement && (movement.endPosition || movement.position);
        }

        // 1. Al presionar (LEFT_DOWN): fijar centro e iniciar arrastre del radio
        mobileToolHandler.setInputAction(function (movement) {
          const point = mobilePick(movement.position);
          if (!point) return;
          centerPoint = point;
          mobileToolPoints = [centerPoint];
          isDraggingRadius = true;
          controller.enableInputs = false; // Desactivar paneo mientras se dibuja el radio

          addMobileEntity({
            position: centerPoint.cartesian,
            point: {
              pixelSize: 8,
              color: Cesium.Color.fromCssColorString('#F3C84B'),
              outlineColor: Cesium.Color.WHITE,
              outlineWidth: 1.5
            }
          });

          dynamicCircleEntity = addMobileEntity({
            position: centerPoint.cartesian,
            ellipse: {
              semiMajorAxis: new Cesium.CallbackProperty(function () { return currentRadius; }, false),
              semiMinorAxis: new Cesium.CallbackProperty(function () { return currentRadius; }, false),
              material: fill,
              outline: true,
              outlineColor: cyan
            },
            label: {
              text: new Cesium.CallbackProperty(function () {
                return currentRadius >= 1000
                  ? (currentRadius / 1000).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' km'
                  : Math.round(currentRadius).toLocaleString('es-MX') + ' m';
              }, false),
              font: 'bold 15px sans-serif',
              fillColor: Cesium.Color.WHITE,
              showBackground: true,
              backgroundColor: Cesium.Color.fromCssColorString('#0B192C').withAlpha(0.92),
              backgroundPadding: new Cesium.Cartesian2(10, 6),
              disableDepthTestDistance: Number.POSITIVE_INFINITY
            }
          });
        }, Cesium.ScreenSpaceEventType.LEFT_DOWN);

        // 2. Al arrastrar (MOUSE_MOVE): redimensionar el círculo dinámicamente
        mobileToolHandler.setInputAction(function (movement) {
          if (!isDraggingRadius || !centerPoint) return;
          updateRadiusFromPosition(movementPosition(movement));
        }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);

        // 3. Al soltar (LEFT_UP): congelar el círculo en el radio final
        mobileToolHandler.setInputAction(function (movement) {
          if (!isDraggingRadius || !centerPoint) return;
          if (movementPosition(movement)) {
            updateRadiusFromPosition(movementPosition(movement));
          }
          isDraggingRadius = false;
          controller.enableInputs = true; // Reactivar controles del mapa

          if (dynamicCircleEntity) {
            const finalRadius = currentRadius;
            const radFormatted = finalRadius >= 1000
              ? (finalRadius / 1000).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' km'
              : Math.round(finalRadius).toLocaleString('es-MX') + ' m';

            dynamicCircleEntity.ellipse.semiMajorAxis = finalRadius;
            dynamicCircleEntity.ellipse.semiMinorAxis = finalRadius;
            dynamicCircleEntity.label.text = radFormatted;
          }

          if (mobileToolHandler) {
            mobileToolHandler.destroy();
            mobileToolHandler = null;
          }
        }, Cesium.ScreenSpaceEventType.LEFT_UP);

        return;
      }

      mobileToolHandler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
      const required = (mode === 'area' || mode === 'zone') ? 3 : 2;
      mobileToolHandler.setInputAction(function (click) {
        const point = mobilePick(click.position);
        if (!point) return;
        mobileToolPoints.push(point);
        addMobileEntity({
          position: point.cartesian,
          point: {
            pixelSize: 8,
            color: Cesium.Color.fromCssColorString('#F3C84B'),
            outlineColor: Cesium.Color.WHITE,
            outlineWidth: 1
          }
        });
        if (mobileToolPoints.length >= required) finishMobileTool(mode);
      }, Cesium.ScreenSpaceEventType.LEFT_CLICK);
    };

    // -------------------------------------------------------------
    // CONVERTIDOR Y Malla TÁCTICA MGRS
    // -------------------------------------------------------------
    function latLonToMGRS(lat, lon, precision) {
      precision = precision || 5;
      if (lat < -80 || lat > 84) return "";

      var zone = Math.floor((lon + 180) / 6) + 1;
      if (lat >= 56 && lat < 64 && lon >= 3 && lon < 12) zone = 32;
      if (lat >= 72 && lat < 84) {
        if (lon >= 0 && lon < 9) zone = 31;
        else if (lon >= 9 && lon < 21) zone = 33;
        else if (lon >= 21 && lon < 33) zone = 35;
        else if (lon >= 33 && lon < 42) zone = 37;
      }

      var latBands = "CDEFGHJKLMNPQRSTUVWXX";
      var band = latBands.charAt(Math.floor((lat + 80) / 8));
      if (lat >= 80) band = 'X';

      var radLat = lat * Math.PI / 180;
      var radLon = lon * Math.PI / 180;
      var a = 6378137.0;
      var f = 1 / 298.257223563;
      var b = a * (1 - f);
      var e2 = (a * a - b * b) / (a * a);
      var e2prime = (a * a - b * b) / (b * b);
      var k0 = 0.9996;

      var lon0 = (zone - 1) * 6 - 180 + 3;
      var radLon0 = lon0 * Math.PI / 180;

      var N = a / Math.sqrt(1 - e2 * Math.sin(radLat) * Math.sin(radLat));
      var T = Math.tan(radLat) * Math.tan(radLat);
      var C = e2prime * Math.cos(radLat) * Math.cos(radLat);
      var A = Math.cos(radLat) * (radLon - radLon0);

      var M = a * ((1 - e2 / 4 - 3 * e2 * e2 / 64 - 5 * e2 * e2 * e2 / 256) * radLat
        - (3 * e2 / 8 + 3 * e2 * e2 / 32 + 45 * e2 * e2 * e2 / 1024) * Math.sin(2 * radLat)
        + (15 * e2 * e2 / 256 + 45 * e2 * e2 * e2 / 1024) * Math.sin(4 * radLat)
        - (35 * e2 * e2 * e2 / 3072) * Math.sin(6 * radLat));

      var easting = k0 * N * (A + (1 - T + C) * Math.pow(A, 3) / 6
        + (5 - 18 * T + T * T + 72 * C - 58 * e2prime) * Math.pow(A, 5) / 120) + 500000;

      var northing = k0 * (M + N * Math.tan(radLat) * (A * A / 2
        + (5 - T + 9 * C + 4 * C * C) * Math.pow(A, 4) / 24
        + (61 - 58 * T + T * T + 600 * C - 330 * e2prime) * Math.pow(A, 6) / 720));
      if (lat < 0) northing += 10000000;

      var set = zone % 6;
      if (set === 0) set = 6;

      var e100k = Math.floor(easting / 100000);
      var n100k = Math.floor(northing / 100000) % 20;

      var colLetters = ["", "ABCDEFGH", "JKLMNPQR", "STUVWXYZ", "ABCDEFGH", "JKLMNPQR", "STUVWXYZ"][set];
      var rowLetters = (set % 2 === 0)
        ? "FGHJKLMNPQRSTUVABCDE"
        : "ABCDEFGHJKLMNPQRSTUV";

      var sqE = colLetters.charAt(e100k);
      var sqN = rowLetters.charAt(n100k);

      var eNum = Math.floor(easting % 100000);
      var nNum = Math.floor(northing % 100000);

      var eStr = String(eNum).padStart(5, '0').slice(0, precision);
      var nStr = String(nNum).padStart(5, '0').slice(0, precision);

      return zone + band + " " + sqE + sqN + " " + eStr + " " + nStr;
    }

    let isMgrsGridActive = false;
    const mgrsGridEntities = [];
    let mgrsBadgeElement = null;

    function createMgrsBadgeIfNeeded() {
      if (!mgrsBadgeElement) {
        mgrsBadgeElement = document.createElement('div');
        mgrsBadgeElement.id = 'mgrsBadge';
        mgrsBadgeElement.style.cssText = `
          position: absolute;
          top: 14px;
          left: 50%;
          transform: translateX(-50%);
          z-index: 9999;
          background: rgba(8, 32, 55, 0.94);
          border: 1.5px solid rgba(0, 210, 255, 0.85);
          border-radius: 20px;
          padding: 6px 18px;
          color: #FFFFFF;
          font-family: monospace, sans-serif;
          font-size: 13px;
          font-weight: bold;
          letter-spacing: 0.8px;
          box-shadow: 0 4px 18px rgba(0, 0, 0, 0.55);
          display: none;
          pointer-events: none;
          white-space: nowrap;
        `;
        document.body.appendChild(mgrsBadgeElement);
      }
    }

    function updateMgrsBadgeAndGrid() {
      if (!isMgrsGridActive || !viewer) return;
      createMgrsBadgeIfNeeded();

      var centerCartesian = viewer.camera.pickEllipsoid(
        new Cesium.Cartesian2(viewer.canvas.clientWidth / 2, viewer.canvas.clientHeight / 2),
        viewer.scene.globe.ellipsoid
      );

      if (centerCartesian) {
        var cartographic = Cesium.Cartographic.fromCartesian(centerCartesian);
        var lat = Cesium.Math.toDegrees(cartographic.latitude);
        var lon = Cesium.Math.toDegrees(cartographic.longitude);
        var mgrsStr = latLonToMGRS(lat, lon, 5);
        if (mgrsBadgeElement) {
          mgrsBadgeElement.innerHTML = `<span style="color:#00D2FF;margin-right:8px;">CENTRO</span> ${mgrsStr}`;
          mgrsBadgeElement.style.display = 'block';
        }
      }

      while (mgrsGridEntities.length) {
        viewer.entities.remove(mgrsGridEntities.pop());
      }

      var rect = viewer.camera.computeViewRectangle();
      if (!rect) return;

      var west = Cesium.Math.toDegrees(rect.west);
      var south = Cesium.Math.toDegrees(rect.south);
      var east = Cesium.Math.toDegrees(rect.east);
      var north = Cesium.Math.toDegrees(rect.north);

      var latSpan = Math.abs(north - south);

      var step = 0.005; // ~500m
      if (latSpan > 0.3) step = 0.02; // ~2km
      if (latSpan > 1.2) step = 0.1; // ~10km
      if (latSpan > 6.0) step = 0.5; // ~50km

      var minLatStep = Math.floor(south / step) * step;
      var maxLatStep = Math.ceil(north / step) * step;
      var minLonStep = Math.floor(west / step) * step;
      var maxLonStep = Math.ceil(east / step) * step;

      var gridColor = Cesium.Color.fromCssColorString('#00D2FF').withAlpha(0.85);

      for (var latVal = minLatStep; latVal <= maxLatStep; latVal += step) {
        if (latVal >= -80 && latVal <= 84) {
          mgrsGridEntities.push(viewer.entities.add({
            polyline: {
              positions: Cesium.Cartesian3.fromDegreesArray([west - 1, latVal, east + 1, latVal]),
              width: 2.5,
              material: gridColor,
              clampToGround: false,
              arcType: Cesium.ArcType.GEODESIC
            }
          }));
        }
      }

      for (var lonVal = minLonStep; lonVal <= maxLonStep; lonVal += step) {
        if (lonVal >= -180 && lonVal <= 180) {
          mgrsGridEntities.push(viewer.entities.add({
            polyline: {
              positions: Cesium.Cartesian3.fromDegreesArray([lonVal, south - 1, lonVal, north + 1]),
              width: 2.5,
              material: gridColor,
              clampToGround: false,
              arcType: Cesium.ArcType.GEODESIC
            }
          }));
        }
      }
    }

    window.toggleMgrsGrid = function (active) {
      if (typeof active === 'boolean') {
        isMgrsGridActive = active;
      } else {
        isMgrsGridActive = !isMgrsGridActive;
      }
      createMgrsBadgeIfNeeded();

      if (!isMgrsGridActive) {
        if (mgrsBadgeElement) mgrsBadgeElement.style.display = 'none';
        while (mgrsGridEntities.length) {
          viewer.entities.remove(mgrsGridEntities.pop());
        }
      } else {
        updateMgrsBadgeAndGrid();
      }
      return isMgrsGridActive;
    };

    // Actualizar MGRS al mover o zoom de la cámara
    if (viewer && viewer.camera) {
      if (viewer.camera.changed) viewer.camera.changed.addEventListener(function () { if (isMgrsGridActive) updateMgrsBadgeAndGrid(); });
      if (viewer.camera.moveEnd) viewer.camera.moveEnd.addEventListener(function () { if (isMgrsGridActive) updateMgrsBadgeAndGrid(); });
    }

    // -------------------------------------------------------------
    // MENSAJES GEO-ANCLADOS (GEO-MSG)
    // -------------------------------------------------------------
    let isGeoMsgMode = false;
    let geoMsgDataUrl = null;

    function getGeoMsgPinIcon() {
      if (!geoMsgDataUrl) {
        try {
          const canvas = document.createElement('canvas');
          canvas.width = 128;
          canvas.height = 160;
          const ctx = canvas.getContext('2d');

          const cx = 64;
          const cy = 54;
          const r = 44;

          // Pin Azul HD (Simetría Perfecta)
          ctx.beginPath();
          ctx.arc(cx, cy, r, Math.PI * 0.82, Math.PI * 0.18, false);
          ctx.lineTo(cx, 154);
          ctx.closePath();

          const grad = ctx.createLinearGradient(0, 10, 0, 154);
          grad.addColorStop(0, '#2997FF');
          grad.addColorStop(1, '#0066CC');
          ctx.fillStyle = grad;
          ctx.fill();
          ctx.lineWidth = 5;
          ctx.strokeStyle = '#FFFFFF';
          ctx.stroke();

          // Círculo Blanco Centrado
          ctx.beginPath();
          ctx.arc(cx, cy, 25, 0, 2 * Math.PI);
          ctx.fillStyle = '#FFFFFF';
          ctx.fill();

          // Bocadillo de Mensaje Centrado
          ctx.fillStyle = '#0066CC';
          ctx.beginPath();
          if (ctx.roundRect) ctx.roundRect(50, 42, 28, 18, 4);
          else ctx.rect(50, 42, 28, 18);
          ctx.fill();

          // Cola del bocadillo
          ctx.beginPath();
          ctx.moveTo(54, 60);
          ctx.lineTo(50, 66);
          ctx.lineTo(60, 60);
          ctx.closePath();
          ctx.fill();

          // Líneas de texto
          ctx.strokeStyle = '#FFFFFF';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(55, 48); ctx.lineTo(73, 48);
          ctx.moveTo(55, 54); ctx.lineTo(67, 54);
          ctx.stroke();

          geoMsgDataUrl = canvas.toDataURL('image/png');
        } catch (e) {
          console.error("Error creando icono GeoMsg: " + e.message);
        }
      }
      return geoMsgDataUrl;
    }

    function getDestinationPinIcon() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 160;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 128, 160);

      const gradient = ctx.createLinearGradient(0, 8, 0, 148);
      gradient.addColorStop(0, '#38BDF8');
      gradient.addColorStop(1, '#1261B5');
      ctx.beginPath();
      ctx.moveTo(64, 148);
      ctx.bezierCurveTo(58, 138, 20, 91, 20, 54);
      ctx.arc(64, 54, 44, Math.PI, 0, false);
      ctx.bezierCurveTo(108, 91, 70, 138, 64, 148);
      ctx.closePath();
      ctx.fillStyle = gradient;
      ctx.fill();
      ctx.lineWidth = 0;

      ctx.beginPath();
      ctx.arc(64, 54, 24, 0, Math.PI * 2);
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#1261B5';
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(64, 54, 8, 0, Math.PI * 2);
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();

      ctx.fillStyle = 'rgba(4, 35, 75, 0.55)';
      ctx.beginPath();
      ctx.ellipse(64, 153, 22, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      return canvas.toDataURL('image/png');
    }

    window.startGeoMsgMode = function () {
      isGeoMsgMode = true;
    };

    window.addGeoMsgToMap = function (id, lat, lon, text, author, isPublic, ownerId) {
      try {
        if (!viewer) return;
        const entityId = 'geomsg_' + id;
        const iconSrc = getGeoMsgPinIcon();

        if (poiEntities.has(entityId)) {
          viewer.entities.remove(poiEntities.get(entityId));
          poiEntities.delete(entityId);
        }

        const entity = viewer.entities.add({
          id: entityId,
          position: Cesium.Cartesian3.fromDegrees(lon, lat),
          billboard: {
            image: iconSrc,
            verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
            heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
            scale: 0.35,
            disableDepthTestDistance: Number.POSITIVE_INFINITY
          },
          properties: {
            poiId: id,
            poiLat: lat,
            poiLon: lon,
            poiName: text,
            poiTipo: 'GEO-MSG',
            poiAuthor: author || 'Yo',
            geoMsgText: text,
            tacticalType: 'geomsg'
            ,geoMsgVisibility: isPublic ? 'PUBLICO' : 'PRIVADO'
            ,geoMsgOwnerId: Number(ownerId || -1)
          }
        });

        poiEntities.set(entityId, entity);
      } catch (e) {
        console.error("Error addGeoMsgToMap: " + e.message);
      }
    };

    window.removeGeoMsgFromMap = function (id) {
      try {
        const entityId = 'geomsg_' + id;
        const entity = poiEntities.get(entityId);
        if (entity) {
          viewer.entities.remove(entity);
          poiEntities.delete(entityId);
        }
        if (activeGeoMsgPopupEntity && String(activeGeoMsgPopupEntity.id) === entityId) hideGeoMsgPopup();
      } catch (e) {
        console.error('Error removeGeoMsgFromMap: ' + e.message);
      }
    };

    window.clearMobileMapTools = function () {
      if (viewer && viewer.scene && viewer.scene.screenSpaceCameraController) {
        viewer.scene.screenSpaceCameraController.enableInputs = true;
      }
      if (mobileToolHandler) { mobileToolHandler.destroy(); mobileToolHandler = null; }
      if (typeof _destroyDrawHandler === 'function') _destroyDrawHandler();
      if (_previewEnt) { viewer.entities.remove(_previewEnt); _previewEnt = null; }
      _drawMode = null;
      _isDrawing = false;
      _drawCoords = [];
      mobileToolPoints = [];
      activeMobileToolGroup = null;
      window.selectMobileToolGroup(null);
      while (mobileToolEntities.length) viewer.entities.remove(mobileToolEntities.pop());
      drawingEntities.forEach(function (entity, localId) {
        if (entity) viewer.entities.remove(entity);
        if (typeof Android !== 'undefined' && typeof Android.onDrawingDeleted === 'function') {
          Android.onDrawingDeleted(localId);
        }
      });
      drawingEntities.clear();
    };

    window.setMobileBaseLayer = function (layer) { setBaseLayer(layer === 'map' ? 'osm' : 'satellite'); };

    function notifyMapDownload(message) {
      try {
        if (window.Android && typeof Android.onMapDownloadStatus === 'function') {
          Android.onMapDownloadStatus(String(message));
        }
      } catch (_) {}
    }

    function notifyMapDownloadProgress(completed, total) {
      try {
        if (window.Android && typeof Android.onMapDownloadProgress === 'function') {
          Android.onMapDownloadProgress(Number(completed) || 0, Number(total) || 0);
        }
      } catch (_) {}
    }

    window.updateOfflineStorageStatus = async function () {
      try {
        let usedBytes = 0;
        const estimatedDownloadedBytes = Number(localStorage.getItem('sedam_map_downloaded_bytes') || 0);
        if ('caches' in window) {
          const cache = await caches.open('sedam-map-tiles-v1');
          const requests = await cache.keys();
          for (const request of requests) {
            const response = await cache.match(request);
            if (!response) continue;
            const length = response.headers.get('content-length');
            // Las teselas externas suelen ser respuestas opacas y no exponen
            // su tamaño; se usa una estimación conservadora para el indicador.
            usedBytes += length
              ? Number(length)
              : response.type === 'opaque'
                ? 50 * 1024
                : (await response.clone().blob()).size;
          }
        }
        usedBytes = Math.max(usedBytes, estimatedDownloadedBytes);
        const storageLimitBytes = 500 * 1024 * 1024;
        const percent = usedBytes > 0
          ? Math.max(1, Math.min(100, Math.round((usedBytes / storageLimitBytes) * 100)))
          : 0;
        if (window.Android && typeof Android.onMapStorageUsage === 'function') {
          Android.onMapStorageUsage(percent, usedBytes);
        }
      } catch (e) {
        console.error('Error calculando almacenamiento offline: ' + e.message);
      }
    };

    window.downloadVisibleMapArea = async function () {
      try {
        if (!viewer || !viewer.camera) return;
        const rectangle = viewer.camera.computeViewRectangle();
        if (!rectangle) {
          notifyMapDownload('No se pudo calcular el área visible');
          return;
        }

        const zoom = Math.max(8, Math.min(16, Math.round(14 - Math.log2(Math.max(1, viewer.camera.positionCartographic.height / 1000)))));
        const west = Cesium.Math.toDegrees(rectangle.west);
        const east = Cesium.Math.toDegrees(rectangle.east);
        const south = Cesium.Math.toDegrees(rectangle.south);
        const north = Cesium.Math.toDegrees(rectangle.north);
        const lonToX = lon => Math.floor((lon + 180) / 360 * Math.pow(2, zoom));
        const latToY = lat => Math.floor((1 - Math.asinh(Math.tan(Cesium.Math.toRadians(lat))) / Math.PI) / 2 * Math.pow(2, zoom));
        const tileCount = Math.pow(2, zoom);
        const minX = Math.max(0, Math.min(tileCount - 1, lonToX(west)));
        const maxX = Math.max(0, Math.min(tileCount - 1, lonToX(east)));
        const minY = Math.max(0, Math.min(tileCount - 1, latToY(north)));
        const maxY = Math.max(0, Math.min(tileCount - 1, latToY(south)));
        const urls = [];
        const layer = localStorage.getItem('sedam_android_map_layer') || 'osm';
        const templates = layer === 'osm'
          ? ['https://tile.openstreetmap.org/{z}/{x}/{y}.png']
          : layer === 'satellite'
            ? ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}']
            : [
                'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
                'https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}'
              ];

        for (let x = minX; x <= maxX; x += 1) {
          for (let y = minY; y <= maxY; y += 1) {
            templates.forEach(template => urls.push(template.replace('{z}', zoom).replace('{x}', x).replace('{y}', y)));
          }
        }
        if (urls.length > 180) {
          notifyMapDownload('Acércate más al mapa para descargar un área más pequeña');
          return;
        }

        const cache = 'caches' in window ? await caches.open('sedam-map-tiles-v1') : null;
        let nextIndex = 0;
        let completed = 0;
        notifyMapDownloadProgress(0, urls.length);
        const workers = Array.from({ length: 6 }, async function () {
          while (true) {
            const index = nextIndex++;
            if (index >= urls.length) break;
            const url = urls[index];
            try {
              const response = await fetch(url, { cache: 'reload', mode: 'no-cors' });
              if (response.ok || response.type === 'opaque') {
                const previousBytes = Number(localStorage.getItem('sedam_map_downloaded_bytes') || 0);
                localStorage.setItem('sedam_map_downloaded_bytes', String(previousBytes + (50 * 1024)));
                if (cache) {
                  try { await cache.put(url, response.clone()); } catch (_) {}
                }
              }
            } catch (_) {
            } finally {
              completed += 1;
              notifyMapDownloadProgress(completed, urls.length);
            }
          }
        });
        await Promise.all(workers);
        await updateOfflineStorageStatus();
      } catch (e) {
        console.error('Error descargando área: ' + e.message);
        notifyMapDownload('No se pudo descargar el área');
      }
    };
  </script>
