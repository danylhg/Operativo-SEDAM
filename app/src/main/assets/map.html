<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>window.CESIUM_BASE_URL = "cesium/";</script>
  <script src="cesium/Cesium.js"></script>
  <script src="milsymbol.min.js"></script>
  <link href="cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
    }

    .cesium-widget-credits {
      display: none !important;
    }

    #cesiumContainer canvas {
      touch-action: none;
    }

    .targetPopup {
      position: absolute;
      z-index: 18;
      width: 210px;
      padding: 11px 12px 10px;
      border: 1px solid rgba(56, 189, 248, .42);
      border-radius: 10px;
      background: rgba(5, 25, 47, .96);
      color: #f5f8fc;
      font: 12px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif;
      box-shadow: 0 6px 14px rgba(0, 0, 0, .3);
      pointer-events: auto;
      display: none;
    }
    .targetPopup::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -8px;
      width: 14px;
      height: 14px;
      background: #061a30;
      border-right: 1px solid rgba(56, 189, 248, .42);
      border-bottom: 1px solid rgba(56, 189, 248, .42);
      transform: translateX(-50%) rotate(45deg);
    }
    /* Reserva el espacio del control de visibilidad para que ningún texto lo invada. */
    .targetPopupName,
    .targetPopupType { width: calc(100% - 92px); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .targetPopupName { font-size: 13px; font-weight: 800; }
    .targetPopupType { margin-top: 2px; color: #9bb0c7; font-size: 10px; }
    .targetPopupRule { height: 1px; margin: 9px 0 8px; background: rgba(129, 157, 187, .18); }
    .targetPopupMetrics { display:none; color: #bff3ff; font-size: 10px; font-weight: 800; letter-spacing: .04em; }
    .targetPopupCoords { display: flex; align-items: center; gap: 6px; margin-top: 7px; color: #9bb0c7; font: 10px ui-monospace, monospace; }
    .targetPopupCopy { margin-left: auto; border: 0; background: transparent; padding: 2px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    .targetPopupActions { display:flex; gap:7px; margin-top:10px; }
    .targetPopupAction { flex:1; min-height:32px; border:1px solid rgba(56,189,248,.35); border-radius:7px; background:rgba(14,116,144,.35); color:#dbeafe; font-size:10px; font-weight:800; display:flex; align-items:center; justify-content:center; gap:6px; }
    #targetPopupEdit { border-color:rgba(56,189,248,.72); background:rgba(14,116,144,.48); color:#dff8ff; box-shadow:inset 0 0 0 1px rgba(56,189,248,.12); }
    #targetPopupDelete { border-color:rgba(248,113,113,.7); background:rgba(127,29,29,.38); color:#fecaca; box-shadow:inset 0 0 0 1px rgba(248,113,113,.12); }
    #targetPopupEdit:active { background:rgba(8,145,178,.7); }
    #targetPopupDelete:active { background:rgba(185,28,28,.65); }
    .targetPopupVisibility { position:absolute; top:31px; right:34px; display:flex; align-items:center; gap:5px; color:#9bb0c7; font-size:9px; }
    .targetPopupSwitch { width:30px; height:17px; appearance:none; border-radius:10px; background:#334155; position:relative; outline:0; }
    .targetPopupSwitch::after { content:""; position:absolute; width:13px; height:13px; top:2px; left:2px; border-radius:50%; background:#cbd5e1; transition:.15s; }
    .targetPopupSwitch:checked { background:#0891b2; }
    .targetPopupSwitch:checked::after { left:15px; background:#fff; }
    #routePopup { padding-bottom: 43px; border-color: rgba(56, 189, 248, .42); background: rgba(7, 31, 56, .97); }
    .targetPopupRoute {
      width: 100%;
      min-height: 38px;
      margin-top: 10px;
      border: 1px solid rgba(125, 184, 200, .5);
      border-radius: 8px;
      background: rgba(20, 72, 91, .42);
      color: #eef8fa;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .035em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }
    .targetPopupRoute:active { background: rgba(38, 111, 133, .68); }
    .targetPopupClose {
      position: absolute;
      top: 6px;
      right: 8px;
      border: none;
      background: transparent;
      color: #9BB0C7;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      padding: 4px;
      transition: color 0.15s ease;
      z-index: 20;
    }
    .targetPopupClose:active {
      color: #F3C84B;
    }
    #geoMsgPopup { width: 238px; border-color: rgba(45, 212, 191, .78); background: rgba(4, 28, 43, .98); box-shadow: 0 8px 24px rgba(0,0,0,.42), inset 0 0 0 1px rgba(45,212,191,.12); }
    #geoMsgPopup::after { background: #05202f; border-color: rgba(45, 212, 191, .58); }
    .geoMsgAuthor { color: #b8fff3; font-size: 13px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .01em; }
    .geoMsgText { margin-top: 9px; padding: 8px 9px; border-left: 2px solid #2dd4bf; border-radius: 4px; background: rgba(15,118,110,.16); color: #ffffff; font-size: 14px; font-weight: 700; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; }
    .geoMsgCoords { margin-top: 10px; color: #b3c7d9; font: 10px ui-monospace, monospace; letter-spacing: .02em; }
    #geoMsgPopup .targetPopupActions { justify-content: flex-end; gap: 8px; margin-top: 11px; }
    #geoMsgPopup .targetPopupVisibility { position: static; top: auto; right: auto; margin: 0 auto 0 0; gap: 5px; font-size: 9px; }
    #geoMsgPopup .targetPopupAction,
    #geoMsgPopup .geoMsgDelete { flex: 0 0 36px; width: 36px; height: 32px; min-height: 32px; margin: 0; padding: 0; border-radius: 7px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
    #geoMsgPopup .targetPopupAction { border:1px solid rgba(56,189,248,.55); background:rgba(14,116,144,.42); color:#dff8ff; }
    #geoMsgPopup .targetPopupAction:active { background:rgba(8,145,178,.72); }
    .geoMsgDelete { border: 1px solid rgba(248,113,113,.7); background: rgba(127,29,29,.38); color: #fecaca; }
    .geoMsgDelete:active { background: rgba(185,28,28,.65); }

    .mapLayerControl {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .mapLayerButton {
      width: 36px;
      height: 36px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.9);
      color: #e5edf5;
      display: grid;
      place-items: center;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.3);
      cursor: pointer;
    }

    .mapLayerMenu {
      position: absolute;
      top: 44px;
      left: 0;
      width: 150px;
      padding: 8px;
      border: 1px solid rgba(59, 130, 246, 0.36);
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.94);
      box-shadow: 0 16px 32px rgba(15, 23, 42, 0.35);
      display: none;
    }

    .mapLayerControl.open .mapLayerMenu {
      display: block;
    }

    .mapLayerOption {
      width: 100%;
      min-height: 38px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #dbeafe;
      font-weight: 800;
      text-align: left;
      padding: 0 10px;
      margin: 2px 0;
    }

    .mapLayerOption.active,
    .mapLayerOption:active {
      background: rgba(14, 116, 144, 0.65);
      color: #bff3ff;
    }

  
    .routePopupEta {
      margin-top: 8px;
      padding: 6px 9px;
      border-radius: 8px;
      background: rgba(0, 210, 255, 0.12);
      border: 1px solid rgba(0, 210, 255, 0.35);
      font-size: 11px;
      font-weight: 700;
      color: #bff3ff;
      line-height: 1.35;
    }
    .poiActionBtn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border: 1px solid rgba(129, 157, 187, 0.3);
      border-radius: 6px;
      background: rgba(15, 23, 42, 0.85);
      color: #e2e8f0;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 10px;
      cursor: pointer;
    }
    .poiActionBtn.deleteBtn {
      border-color: rgba(239, 68, 68, 0.45);
      background: rgba(239, 68, 68, 0.18);
      color: #fca5a5;
    }
    .poiActionBtn.deleteBtn:active {
      background: rgba(239, 68, 68, 0.35);
    }

  </style>
</head>

<body>
  <div id="cesiumContainer"></div>
  <div id="targetPopup" class="targetPopup" role="dialog" aria-label="Información del blanco">
    <button id="targetPopupClose" class="targetPopupClose" type="button" aria-label="Cerrar/Borrar">✕</button>
    <div id="targetPopupName" class="targetPopupName"></div>
    <div class="targetPopupVisibility"><span id="targetPopupVisibilityLabel">Privado</span><input id="targetPopupVisibility" class="targetPopupSwitch" type="checkbox" aria-label="Cambiar visibilidad"></div>
    <div id="targetPopupType" class="targetPopupType"></div>
    <div class="targetPopupRule"></div>
    <div class="targetPopupMetrics">▲ RUMBO 0° N &nbsp;·&nbsp; VEL. 0.0 km/h</div>
    <div class="targetPopupCoords">
      <svg width="11" height="14" viewBox="0 0 14 18" fill="#9bb0c7" style="vertical-align: middle; flex-shrink: 0; display: inline-block;"><path fill-rule="evenodd" clip-rule="evenodd" d="M7 0C3.13401 0 0 3.13401 0 7C0 12.25 7 18 7 18C7 18 14 12.25 14 7C14 3.13401 10.866 0 7 0ZM7 9.5C5.61929 9.5 4.5 8.38071 4.5 7C4.5 5.61929 5.61929 4.5 7 4.5C8.38071 4.5 9.5 5.61929 9.5 7C9.5 8.38071 8.38071 9.5 7 9.5Z"/></svg>
      <span id="targetPopupCoords"></span>
      <button id="targetPopupCopy" class="targetPopupCopy" type="button" aria-label="Copiar coordenadas">
        <svg width="14" height="14" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" style="vertical-align: middle; display: inline-block;"><rect x="5.5" y="5.5" width="10" height="10" rx="1.5" stroke="#e6c34b" stroke-width="1.8"/><path d="M3.5 12.5H2.5C1.94772 12.5 1.5 12.0523 1.5 11.5V2.5C1.5 1.94772 1.94772 1.5 2.5 1.5H11.5C12.0523 1.5 12.5 1.94772 12.5 2.5V3.5" stroke="#e6c34b" stroke-width="1.8" stroke-linecap="round"/></svg>

      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="6" cy="18" r="2.5" stroke="currentColor" stroke-width="2"/><path d="M8.5 18h2.2c1.7 0 2.7-1 2.7-2.5V8.7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M17 3.5a3.5 3.5 0 0 0-3.5 3.5c0 2.6 3.5 6 3.5 6s3.5-3.4 3.5-6A3.5 3.5 0 0 0 17 3.5Z" stroke="currentColor" stroke-width="2"/><circle cx="17" cy="7" r="1" fill="currentColor"/></svg>
      IR DESDE MI UBICACIÓN
    </button>
    <div class="targetPopupActions"><button id="targetPopupEdit" class="targetPopupAction" type="button"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg> EDITAR</button><button id="targetPopupDelete" class="targetPopupAction" type="button"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> ELIMINAR</button></div>
  </div>

  <!-- Modal EXCLUSIVO e INDEPENDIENTE para Rutas de Navegación -->
  <div id="geoMsgPopup" class="targetPopup" role="dialog" aria-label="Mensaje Geo-anclado">
    <div id="geoMsgPopupAuthor" class="geoMsgAuthor"></div>
    <div id="geoMsgPopupText" class="geoMsgText"></div>
    <div id="geoMsgPopupCoords" class="geoMsgCoords"></div>
    <div class="targetPopupActions"><div id="geoMsgPopupVisibilityRow" class="targetPopupVisibility"><span id="geoMsgPopupVisibilityLabel">Privado</span><input id="geoMsgPopupVisibility" class="targetPopupSwitch" type="checkbox" aria-label="Cambiar visibilidad del GEO-MSG"></div><button id="geoMsgPopupEdit" class="targetPopupAction" type="button" aria-label="Editar mensaje Geo-anclado" title="Editar mensaje Geo-anclado"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg></button><button id="geoMsgPopupDelete" class="geoMsgDelete" type="button" aria-label="Eliminar mensaje Geo-anclado" title="Eliminar mensaje Geo-anclado">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
    </button></div>
  </div>

  <div id="routePopup" class="targetPopup" role="dialog" aria-label="Información de la ruta" style="display:none;">
    <button id="routePopupClose" class="targetPopupClose" type="button" aria-label="Cerrar">✕</button>
    <div id="routePopupTitle" class="targetPopupName" style="padding-right:20px;">Ruta de navegación</div>
    <div id="routePopupCreator" class="targetPopupType" style="margin-top:2px;white-space:normal;"></div>
    <div class="targetPopupRule"></div>
    <div class="targetPopupCoords">
      <svg width="11" height="14" viewBox="0 0 14 18" fill="#9bb0c7" style="vertical-align: middle; flex-shrink: 0; display: inline-block;"><path fill-rule="evenodd" clip-rule="evenodd" d="M7 0C3.13401 0 0 3.13401 0 7C0 12.25 7 18 7 18C7 18 14 12.25 14 7C14 3.13401 10.866 0 7 0ZM7 9.5C5.61929 9.5 4.5 8.38071 4.5 7C4.5 5.61929 5.61929 4.5 7 4.5C8.38071 4.5 9.5 5.61929 9.5 7C9.5 8.38071 8.38071 9.5 7 9.5Z"/></svg>
      <span id="routePopupCoords"></span>
      <button id="routePopupCopy" class="targetPopupCopy" type="button" aria-label="Copiar coordenadas">
        <svg width="14" height="14" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" style="vertical-align: middle; display: inline-block;"><rect x="5.5" y="5.5" width="10" height="10" rx="1.5" stroke="#38bdf8" stroke-width="1.8"/><path d="M3.5 12.5H2.5C1.94772 12.5 1.5 12.0523 1.5 11.5V2.5C1.5 1.94772 1.94772 1.5 2.5 1.5H11.5C12.0523 1.5 12.5 1.94772 12.5 2.5V3.5" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="routePopupEta" style="display:block;margin-top:8px;color:#bff3ff;font-size:11px;font-weight:700;line-height:1.35;"></div>
    <button id="routePopupDeleteBtn" class="poiActionBtn deleteBtn" type="button" aria-label="Eliminar ruta" title="Eliminar ruta" style="position:absolute;bottom:5px;right:8px;width:30px;height:27px;min-height:27px;margin:0;padding:0;">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
    </button>
  </div>

  <script>
    let viewer = null;
    let userMarker = null;

    if (!window.Cesium) {
      document.body.innerHTML =
        '<div style="height:100%;display:flex;align-items:center;justify-content:center;padding:24px;background:#dbe7f1;color:#0f172a;font-family:system-ui,sans-serif;text-align:center;font-weight:800;">No se pudo cargar el mapa. Revisa la conexiÃ³n a internet del dispositivo.</div>';
      throw new Error("Cesium no cargÃ³");
    }

    // Escala Ã­conos/etiquetas con la distancia de la cÃ¡mara:
    // cerca (1 km) â†’ Ã—1.5 ; lejos (2 000 km) â†’ Ã—0.1
    const SCALE_BY_DIST = new Cesium.NearFarScalar(1e3, 1.0, 2e6, 0.04);

    // =========================
    // Estado de rutas
    // =========================
    let pickMode = null; // "start" | "end" | null
    let startPoint = null;
    let endPoint = null;
    let lastRoute = null;

    let startEntity = null;
    let endEntity = null;
    let routeEntity = null;
    let routePickEntity = null;
    let selectedRouteVehicleId = "global";

    let remoteRoutes = new Map();
    let tacticalRoutes = new Map();
    const trackingPersonalEntities = new Map();
    const trackingVehiculoEntities = new Map();
    const trackingEquipoEntities = new Map();
    const trackingDispositivoEntities = new Map();
    const trackingHeadingEntities = new Map();
    const trackingDispositivoLatest = new Map();
    const requestedDispositivoTrackingIds = new Set();
    const emergencyPulseEntities = new Map();
    let selectedTrackingKind = null;
    let selectedTrackingId = null;
    let selectedTrackingPersonalId = null;
    let followedTrackingPersonalId = null;
    let followMyLocation = false;
    // Mantener una distancia mínima evita que los proveedores de teselas
    // respondan con "Map data not yet available" al centrar la ubicación.
    // Distancia mínima segura para evitar que algunos dispositivos entren
    // en el nivel de renderizado que puede cubrir el mapa con la cuadrícula.
    const MIN_CAMERA_ZOOM_DISTANCE = 1200;
    const FOLLOW_LOCATION_ZOOM = 1200;
    const FOLLOW_TRACKING_ZOOM = 1200;
    const TRACKING_PERSONAL_COLOR = Cesium.Color.fromCssColorString("#00BFFF");
    const TRACKING_PERSONAL_SELECTED_COLOR = Cesium.Color.fromCssColorString("#2563EB");
    const TRACKING_VEHICULO_COLOR = Cesium.Color.fromCssColorString("#FFD700");
    const TRACKING_EQUIPO_COLOR = Cesium.Color.fromCssColorString("#B4FF39");
    const TRACKING_DISPOSITIVO_COLOR = Cesium.Color.fromCssColorString("#38BDF8");
    const TRACKING_SELECTED_COLOR = Cesium.Color.fromCssColorString("#2563EB");
    const TRACKING_ACTIVE_COLOR = Cesium.Color.LIME;
    const TRACKING_SYMBOL_SIZE = 42;
    const TRACKING_SYMBOL_RENDER_SIZE = 160;
    const TRACKING_HEADING_START_M = 7;
    const TRACKING_HEADING_LENGTH_M = 32;
    const TRACKING_LABEL_MAX_CHARS = 18;
    const TRACKING_DRONE_LABEL_MAX_CHARS = 14;
    const TRACKING_SYMBOL_SCALE_BY_DIST = new Cesium.NearFarScalar(1e3, 1.0, 2e6, 0.28);
    const HEADING_LINE_LENGTH_METERS = 90;
    const HEADING_LINE_WIDTH = 4;
    const trackingSymbolImageCache = new Map();
    const EMERGENCY_PULSE_COLORS = [
      Cesium.Color.fromCssColorString("#FF1D25"),
      Cesium.Color.fromCssColorString("#FFD400"),
      Cesium.Color.fromCssColorString("#00E5FF")
    ];

    const OSRM_BASE = "https://router.project-osrm.org";
    const ROUTE_COLOR_HEX = [
      "#FF00FF", "#FFA500", "#32CD32",
      "#FFC0CB", "#00BFFF", "#FF69B4",
      "#FFD700", "#EE82EE", "#00FF7F"
    ];
    const CAMERA_STATE_TTL_MS = 24 * 60 * 60 * 1000;
    let cameraStateKey = "sedam_map_camera_default";
    let cameraStateSaveTimer = null;
    let firstOperationViewHandled = false;
    let restoredCameraAt = 0;

    const BASE_LAYER_PROVIDERS = {
      osm: () => new Cesium.UrlTemplateImageryProvider({
        url: "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
        // Niveles superiores pueden devolver mosaicos grises de Esri en
        // algunas zonas. Cesium ampliará el nivel 17 y mantendrá el mapa visible.
        maximumLevel: 19,
        credit: "© OpenStreetMap contributors"
      }),
      satellite: () => new Cesium.UrlTemplateImageryProvider({
        url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        // Solicita el nivel disponible de fotografía aérea antes de ampliar una tesela.
        // Por encima de este nivel Esri puede devolver mosaicos vacíos.
        // Cesium ampliará la última tesela válida y el mapa seguirá visible.
        maximumLevel: 19,
        credit: "Esri World Imagery"
      }),
      reference: () => new Cesium.UrlTemplateImageryProvider({
        url: "https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
        maximumLevel: 19,
        credit: "Esri Reference"
      })
    };

    // Si el servidor de imágenes falla, conserva un mapa visible usando calles.
    // Esto evita dejar el globo vacío con el mensaje "Map data not available".
    function addImageryWithFallback(primaryLayer, fallbackKey) {
      const provider = primaryLayer && primaryLayer.imageryProvider;
      if (!provider || !provider.errorEvent) return;
      let failures = 0;
      let switched = false;
      provider.errorEvent.addEventListener(function () {
        if (switched || ++failures < 3 || !viewer) return;
        switched = true;
        if (viewer.imageryLayers.contains(primaryLayer)) {
          viewer.imageryLayers.remove(primaryLayer, true);
          viewer.imageryLayers.addImageryProvider(BASE_LAYER_PROVIDERS[fallbackKey]());
          viewer.scene.requestRender();
        }
      });
    }

    function updateLayerButtons(key) {
      document.querySelectorAll("[data-map-layer]").forEach((button) => {
        button.classList.toggle("active", button.dataset.mapLayer === key);
      });
    }

    function setBaseLayer(key) {
      if (!viewer) return;
      const layerKey = ["osm", "satellite", "hybrid"].includes(key) ? key : "hybrid";

      try {
        localStorage.setItem("sedam_android_map_layer", layerKey);
      } catch (_) {}

      updateLayerButtons(layerKey);
      viewer.imageryLayers.removeAll();

      if (layerKey === "hybrid") {
        const satelliteLayer = viewer.imageryLayers.addImageryProvider(BASE_LAYER_PROVIDERS.satellite());
        addImageryWithFallback(satelliteLayer, "osm");
        const referenceOverlay = viewer.imageryLayers.addImageryProvider(BASE_LAYER_PROVIDERS.reference());
        referenceOverlay.alpha = 0.78;
        return;
      }

      const layer = viewer.imageryLayers.addImageryProvider(BASE_LAYER_PROVIDERS[layerKey]());
      if (layerKey === "satellite") addImageryWithFallback(layer, "osm");
    }

        const open = control.classList.toggle("open");
        button.setAttribute("aria-expanded", String(open));

          control.classList.remove("open");

    function captureCameraState() {
      if (!viewer || !viewer.camera) return null;
      const cartographic = Cesium.Cartographic.fromCartesian(viewer.camera.positionWC || viewer.camera.position);
      if (!cartographic) return null;

      return {
        lat: Cesium.Math.toDegrees(cartographic.latitude),
        lon: Cesium.Math.toDegrees(cartographic.longitude),
        height: cartographic.height,
        heading: viewer.camera.heading,
        pitch: viewer.camera.pitch,
        roll: viewer.camera.roll,
        savedAt: Date.now()
      };
    }

    function saveCameraStateNow() {
      try {
        const state = captureCameraState();
        if (!state) return;
        localStorage.setItem(cameraStateKey, JSON.stringify(state));
      } catch (e) {
        console.warn("No se pudo guardar la camara: " + e.message);
      }
    }

    function scheduleCameraStateSave() {

    function restoreCameraState() {
      try {
        const raw = localStorage.getItem(cameraStateKey);
        if (!raw) return false;

        const state = JSON.parse(raw);
        if (!state || Date.now() - Number(state.savedAt || 0) > CAMERA_STATE_TTL_MS) {
          localStorage.removeItem(cameraStateKey);
          return false;
        }

        const lat = Number(state.lat);
        const lon = Number(state.lon);
        const height = Math.max(Number(state.height), MIN_CAMERA_ZOOM_DISTANCE);
        if (!Number.isFinite(lat) || !Number.isFinite(lon) || !Number.isFinite(height)) return false;

        viewer.camera.setView({
          destination: Cesium.Cartesian3.fromDegrees(lon, lat, height),
          orientation: {
            heading: Number.isFinite(Number(state.heading)) ? Number(state.heading) : 0,
            pitch: Number.isFinite(Number(state.pitch)) ? Number(state.pitch) : -Cesium.Math.PI_OVER_TWO,
            roll: Number.isFinite(Number(state.roll)) ? Number(state.roll) : 0
          }
        });

        restoredCameraAt = Date.now();
        resizeCesium();
        return true;
      } catch (e) {
        console.warn("No se pudo restaurar la camara: " + e.message);
        return false;
      }
    }

    function stableRouteColorHex(id) {
      if (!id || id === "global") return "#00FFFF";

      const text = String(id);
      let hash = 0;
      for (let i = 0; i < text.length; i += 1) {
        hash = text.charCodeAt(i) + ((hash << 5) - hash);
        hash |= 0;
      }
      return ROUTE_COLOR_HEX[Math.abs(hash) % ROUTE_COLOR_HEX.length];
    }

    function routeColorFromData(route) {
      const explicit = route && typeof route.color === "string" ? route.color.trim() : "";
      if (/^#[0-9A-F]{6}$/i.test(explicit) && explicit.toUpperCase() !== "#1E90FF") {
        return explicit;
      }
      const creator = route && (route.creador_nombre || route.routeCreator || route.creador || route.createdBy);
      const creatorKey = String(creator || '').toLowerCase();
      if (creatorKey.includes('pineda')) return '#9333EA';
      if (creatorKey.includes('campos')) return '#F97316';
      const vehicleId = route && route.id_vehiculo != null ? String(route.id_vehiculo) : "global";
      return stableRouteColorHex(creator || vehicleId);
    }

    function formatAbbreviatedPersonLabel(rawText) {
      if (!rawText) return '';

      text = text.replace(/\s*\([^)]*\)/g, '').trim();

      const rankReplacements = [

        [/\bCapit[aá]n\s+de\s+Fragata\b/gi, 'Cap. Frag.'],

        [/\bCapit[aá]n\s+1(?:\/o|\.º|\.o|er|ro)?\b/gi, 'Cap. 1/o'],
        [/\bCapit[aá]n\s+2(?:\/o|\.º|\.o|do|ndo)?\b/gi, 'Cap. 2/o'],
        [/\bCapit[aá]n\b/gi, 'Cap.'],
        [/\bTeniente\s+de\s+Nav[ií]o\b/gi, 'Tte. Nav.'],
        [/\bTeniente\s+de\s+Fragata\b/gi, 'Tte. Frag.'],
        [/\bTeniente\s+de\s+Corbeta\b/gi, 'Tte. Corb.'],
        [/\bSubteniente\b/gi, 'Subtte.'],
        [/\bTeniente\b/gi, 'Tte.'],
        [/\bSargento\s+1(?:\/o|\.º|\.o|er|ro)?\b/gi, 'Sgto. 1/o'],
        [/\bSargento\s+2(?:\/o|\.º|\.o|do|ndo)?\b/gi, 'Sgto. 2/o'],

        [/\bCabo\b/gi, 'Cbo.'],
        [/\bMarinero\b/gi, 'Mro.'],
        [/\bSoldado\b/gi, 'Sld.'],
        [/\bGeneral\s+de\s+Divisi[oó]n\b/gi, 'Gral. Div.'],
        [/\bGeneral\s+de\s+Brigada\b/gi, 'Gral. Bgda.'],
        [/\bGeneral\s+Brigadier\b/gi, 'Gral. Bgda.'],
        [/\bGeneral\b/gi, 'Gral.'],
        [/\bAlmirante\b/gi, 'Alm.'],
        [/\bVicealmirante\b/gi, 'Valm.'],
        [/\bContralmirante\b/gi, 'Calm.'],

    function calculateDistanceMeters(lat1, lon1, lat2, lon2) {
      if (!Number.isFinite(lat1) || !Number.isFinite(lon1) || !Number.isFinite(lat2) || !Number.isFinite(lon2)) return 0;
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

      if (userMarker && userMarker.position) {

    function getDestinationCoordsFromEntity(entity) {
      if (!entity) return null;

      let lat = Number(getEntityProperty(entity, 'routeDestinationLat') ??
                       getEntityProperty(entity, 'destino_lat') ??
                       getEntityProperty(entity, 'poiLat'));
      let lon = Number(getEntityProperty(entity, 'routeDestinationLon') ??
                       getEntityProperty(entity, 'destino_lon') ??
                       getEntityProperty(entity, 'poiLon'));

      if (Number.isFinite(lat) && Number.isFinite(lon) && (Math.abs(lat) > 0.000001 || Math.abs(lon) > 0.000001)) {
        return { lat, lon };
      }

      const entityId = String(entity.id || '');
      if (entityId.indexOf('remote_route_') === 0) {
        const routeId = Number(entityId.replace('remote_route_destination_', '').replace('remote_route_', ''));
        if (Number.isFinite(routeId) && remoteRoutes.has(routeId)) {
          const parentLine = remoteRoutes.get(routeId);
          if (parentLine && parentLine !== entity) {
            const parentCoords = getDestinationCoordsFromEntity(parentLine);
            if (parentCoords) return parentCoords;
          }
        }
      }

      if (entity._destinationEntity && entity._destinationEntity.position) {
        const pos = entity._destinationEntity.position.getValue
          ? entity._destinationEntity.position.getValue(viewer.clock.currentTime)
          : entity._destinationEntity.position;
        if (pos) {
          const carto = Cesium.Cartographic.fromCartesian(pos);
          if (carto) {
            const dLat = Cesium.Math.toDegrees(carto.latitude);
            const dLon = Cesium.Math.toDegrees(carto.longitude);
            if (Number.isFinite(dLat) && Number.isFinite(dLon) && (Math.abs(dLat) > 0.000001 || Math.abs(dLon) > 0.000001)) {
              return { lat: dLat, lon: dLon };
            }
          }
        }
      }

      if (entity.position) {
        const pos = entity.position.getValue
          ? entity.position.getValue(viewer.clock.currentTime)
          : entity.position;
        if (pos) {
          const carto = Cesium.Cartographic.fromCartesian(pos);
          if (carto) {
            const dLat = Cesium.Math.toDegrees(carto.latitude);
            const dLon = Cesium.Math.toDegrees(carto.longitude);
            if (Number.isFinite(dLat) && Number.isFinite(dLon) && (Math.abs(dLat) > 0.000001 || Math.abs(dLon) > 0.000001)) {
              return { lat: dLat, lon: dLon };
            }
          }
        }
      }

      if (entity.polyline && entity.polyline.positions) {
        const positions = entity.polyline.positions.getValue
          ? entity.polyline.positions.getValue(viewer.clock.currentTime)
          : entity.polyline.positions;
        if (Array.isArray(positions) && positions.length > 0) {
          const lastPos = positions[positions.length - 1];
          if (lastPos) {
            const carto = Cesium.Cartographic.fromCartesian(lastPos);
            if (carto) {
              const dLat = Cesium.Math.toDegrees(carto.latitude);
              const dLon = Cesium.Math.toDegrees(carto.longitude);
              if (Number.isFinite(dLat) && Number.isFinite(dLon) && (Math.abs(dLat) > 0.000001 || Math.abs(dLon) > 0.000001)) {
                return { lat: dLat, lon: dLon };
              }
            }
          }
        }
      }

      if (endPoint && Number.isFinite(endPoint.lat) && Number.isFinite(endPoint.lon)) {
        return { lat: endPoint.lat, lon: endPoint.lon };
      }

      return null;
    }

    function updateRoutePopupPosition(screenPosition) {
      const popup = document.getElementById('routePopup');
      if (!popup || popup.style.display === 'none') return;

      if (screenPosition) {
        activeRoutePopupScreenPos = screenPosition;
      }

      let pos = screenPosition || activeRoutePopupScreenPos;
      if (!pos && activeRoutePopupEntity && viewer) {
        let cartesian = null;
        if (activeRoutePopupEntity.position) {
          cartesian = activeRoutePopupEntity.position.getValue ? activeRoutePopupEntity.position.getValue(viewer.clock.currentTime) : activeRoutePopupEntity.position;
        } else if (activeRoutePopupEntity._destinationEntity && activeRoutePopupEntity._destinationEntity.position) {
          const destPos = activeRoutePopupEntity._destinationEntity.position;
          cartesian = destPos.getValue ? destPos.getValue(viewer.clock.currentTime) : destPos;
        }
        if (cartesian) {
          pos = Cesium.SceneTransforms.wgs84ToWindowCoordinates(viewer.scene, cartesian);
        }
      }
      if (!pos) return;

      const viewportWidth = (viewer && viewer.canvas) ? viewer.canvas.clientWidth : window.innerWidth;
      const viewportHeight = (viewer && viewer.canvas) ? viewer.canvas.clientHeight : window.innerHeight;
      const width = popup.offsetWidth || 240;
      const height = popup.offsetHeight || 140;

      const posX = pos.x != null ? pos.x : pos.left || (viewportWidth / 2);
      const posY = pos.y != null ? pos.y : pos.top || (viewportHeight / 2);

      let left = posX - width / 2;
      let top = posY - height - 18;

      if (top < 16) {
        top = posY + 20;
      }

      const maxTop = Math.max(16, viewportHeight - height - 75);
      top = Math.max(16, Math.min(maxTop, top));
      left = Math.max(12, Math.min(viewportWidth - width - 12, left));

      popup.style.left = Math.round(left) + 'px';
      popup.style.top = Math.round(top) + 'px';
    }

    function showRoutePopup(entity, screenPosition) {
      if (!entity) { hideRoutePopup(); return; }
      const popup = document.getElementById('routePopup');
      if (!popup) return;

      hideTargetPopup();

      const entityId = String(entity.id || '');
      const routeCreator = String(getEntityProperty(entity, 'routeCreator') || getEntityProperty(entity, 'creador_nombre') || getEntityProperty(entity, 'creador') || getEntityProperty(entity, 'createdBy') || '').trim();
      const routeCreatorRank = String(getEntityProperty(entity, 'routeCreatorRank') || getEntityProperty(entity, 'creador_puesto') || getEntityProperty(entity, 'cargo') || getEntityProperty(entity, 'creatorRank') || '').trim();

      const destCoords = getDestinationCoordsFromEntity(entity);
      const destinationLat = destCoords ? destCoords.lat : null;
      const destinationLon = destCoords ? destCoords.lon : null;

      let coords = (Number.isFinite(destinationLat) && Number.isFinite(destinationLon))
        ? destinationLat.toFixed(5) + ', ' + destinationLon.toFixed(5) : '';

      const creatorEl = document.getElementById('routePopupCreator');
      if (creatorEl) {
        let creatorName = routeCreator;
        // Algunas rutas recibidas por socket traen únicamente el username (ej. gpineda).
        // En ese caso usamos la etiqueta completa del usuario actual.
        const isLocalRoute = entity === routeEntity || entity === endEntity || String(entity.id || '').indexOf('route_navigation') === 0;
        if (isLocalRoute && creatorName && !/\s/.test(creatorName)) {
          creatorName = getCurrentRouteCreatorLabel() || creatorName;
        }
        const creatorText = formatAbbreviatedPersonLabel([routeCreatorRank, creatorName].filter(Boolean).join(' '));
        creatorEl.textContent = creatorText ? 'Creada por: ' + creatorText : 'Creada por: Usuario';
      }

      const coordsEl = document.getElementById('routePopupCoords');
      if (coordsEl) coordsEl.textContent = coords;
      popup.dataset.coords = coords;
      const durationSeconds = Number(getEntityProperty(entity, 'routeDurationS') || 0);
      const routeEta = document.getElementById('routePopupEta');
      if (routeEta) {
        routeEta.style.display = 'block';

        const userLoc = getUserCurrentLocation();

        if (userLoc && Number.isFinite(destinationLat) && Number.isFinite(destinationLon)) {
          const distM = calculateDistanceMeters(userLoc.lat, userLoc.lon, destinationLat, destinationLon);
          const distKm = (distM / 1000).toFixed(1);

          if (distM < 50) {
            routeEta.textContent = '⏱ En el destino (< 50 m)';
          } else {
            routeEta.textContent = '⏱ Calculando tiempo desde mi ubicación…';
            getOsrmRoute(userLoc, { lat: destinationLat, lon: destinationLon })
              .then(function (routeFromHere) {
                const totalSec = Number(routeFromHere.duration || 0);
                const minutes = Math.max(1, Math.round(totalSec / 60));
                const finalKm = ((Number(routeFromHere.distance) || distM) / 1000).toFixed(1);
                const timeFormatted = minutes >= 60 ? (Math.floor(minutes / 60) + ' h ' + (minutes % 60) + ' min') : (minutes + ' min');
                routeEta.textContent = '⏱ Tiempo: ' + timeFormatted + ' (' + finalKm + ' km)';
              })
              .catch(function () {
                const estMinutes = Math.max(1, Math.round(((distM / 1000) / 40) * 60));
                const timeFormatted = estMinutes >= 60 ? (Math.floor(estMinutes / 60) + ' h ' + (estMinutes % 60) + ' min') : (estMinutes + ' min');
                routeEta.textContent = '⏱ Tiempo estimado: ~' + timeFormatted + ' (' + distKm + ' km)';
              });
          }
        } else if (durationSeconds > 0) {
          const savedMinutes = Math.max(1, Math.round(durationSeconds / 60));

          (currentLabel && creatorLabel && (creatorLabel === currentLabel || creatorLabel.includes(currentLabel) || currentLabel.includes(creatorLabel)));
        routeDelBtn.style.display = isOwnRoute ? 'inline-flex' : 'none';
      }

      activeRoutePopupEntity = entity;
      popup.style.display = 'block';
      updateRoutePopupPosition(screenPosition);

    function updatePopupPosition(screenPosition) {
      const popup = document.getElementById('targetPopup');
      if (!popup || popup.style.display === 'none') return;

      let pos = screenPosition;
      if (!pos && activePopupEntity && activePopupEntity.position && viewer) {
        const cartesian = activePopupEntity.position.getValue ? activePopupEntity.position.getValue(viewer.clock.currentTime) : activePopupEntity.position;
        if (cartesian) {
          pos = Cesium.SceneTransforms.wgs84ToWindowCoordinates(viewer.scene, cartesian);
        }
      }
      if (!pos) return;

      const viewportWidth = (viewer && viewer.canvas) ? viewer.canvas.clientWidth : window.innerWidth;
      const viewportHeight = (viewer && viewer.canvas) ? viewer.canvas.clientHeight : window.innerHeight;
      const width = popup.offsetWidth || 210;
      const height = popup.offsetHeight || 96;

      const posX = pos.x != null ? pos.x : pos.left || (viewportWidth / 2);
      const posY = pos.y != null ? pos.y : pos.top || (viewportHeight / 2);

      let left = posX - width / 2;
      let top = posY - height - 18;

      if (top < 16) top = posY + 20;

      const maxTop = Math.max(16, viewportHeight - height - 75);
      top = Math.max(16, Math.min(maxTop, top));
      left = Math.max(8, Math.min(viewportWidth - width - 8, left));

      popup.style.left = Math.round(left) + 'px';
      popup.style.top = Math.round(top) + 'px';
    }

      let rumbo = Number(getEntityProperty(entity, 'rumbo') ?? getEntityProperty(entity, 'heading') ?? getEntityProperty(entity, 'headingDegrees') ?? 0);

      if (!Number.isFinite(vel)) vel = 0;
      // El movimiento mantiene la fuente activa en poiMotionStates. Usarla

      const normTipo = tipo.toUpperCase();

        if (creator && !subtitle.includes(creator)) {

    function isIgnoredSelectionEntity(entity) {
      if (!entity) return true;
      if (entity === userMarker) return true;
      if (entity._isGrid || entity._isCompass || entity._isZone) return true;
      const entityId = String(entity.id || "");
      if (entityId.indexOf("grid_") === 0 || entityId.indexOf("rose_") === 0 || entityId.indexOf("zone_") === 0) return true;
      const tacticalType = String(getEntityProperty(entity, "tacticalType") || "");
      const trackingKind = String(getEntityProperty(entity, "trackingKind") || "");
      if (tacticalType === "tracking-heading" || trackingKind === "heading" || tacticalType === "grid" || tacticalType === "zone") return true;
      return false;
    }

    function getSelectableEntityAt(position) {
      if (!viewer || !viewer.scene) return null;

      try {
        const pickedItems = viewer.scene.drillPick ? viewer.scene.drillPick(position, 10) : [];

        // Personal y recursos rastreados tienen prioridad absoluta. Una
        // persona puede coincidir con el extremo de una ruta; el toque debe
        // abrir su ficha y no el popup de navegacion.
        for (const picked of pickedItems) {
          const ent = picked && picked.id;
          if (ent && !isIgnoredSelectionEntity(ent)) {
            const trackingKind = String(getEntityProperty(ent, "trackingKind") || "");
            if (isTrackingKind(trackingKind)) return ent;
          }
        }
        
        // 1. POIs / Blancos / Waypoints tienen máxima prioridad
        for (const picked of pickedItems) {
          const ent = picked && picked.id;
          if (ent && !isIgnoredSelectionEntity(ent)) {
            const entId = String(ent.id || "");
            const poiTipo = String(getEntityProperty(ent, "poiTipo") || "");
            if (entId.indexOf("poi_") === 0 || entId.indexOf("geomsg_") === 0 || poiTipo === "POI" || poiTipo === "MIL" || poiTipo === "GEO-MSG") {
              return ent;
            }
          }
        }

        // 2. Tracking de personal / vehículos / equipos
        for (const picked of pickedItems) {
          const ent = picked && picked.id;
          if (ent && !isIgnoredSelectionEntity(ent)) {
            const trackingKind = String(getEntityProperty(ent, "trackingKind") || "");
            if (isTrackingKind(trackingKind)) {
              return ent;
            }
          }
        }

        // 3. Rutas de navegación
        for (const picked of pickedItems) {
          const ent = picked && picked.id;
          if (ent && !isIgnoredSelectionEntity(ent)) {
            const entId = String(ent.id || "");
            if (entId.indexOf("remote_route_") === 0 || ent === routeEntity || ent === endEntity || getEntityProperty(ent, "tacticalType") === "navigation-route") {
              return ent;
            }
          }
        }

      } catch (e) {}

      try {
        const picked = viewer.scene.pick(position);
        if (picked && picked.id && !isIgnoredSelectionEntity(picked.id)) {
          const ent = picked.id;
          const entId = String(ent.id || "");
          if (entId.indexOf("poi_") === 0 || entId.indexOf("geomsg_") === 0 ||
              entId.indexOf("area_") === 0 || entId.indexOf("estructura_") === 0 ||
              entId.indexOf("remote_route_") === 0 || ent === routeEntity || ent === endEntity ||
              isTrackingKind(String(getEntityProperty(ent, "trackingKind") || ""))) {
            return ent;
          }
        }
      } catch (e) {}

      return null;
    }

    function getSelectableObjectAt(position) {
      if (!viewer) return null;
      const entity = getSelectableEntityAt(position);
      if (!entity) return null;
      const entityId = String(entity.id || "");
      const label = getEntityText(entity);

      // Si la entidad trae propiedades de ruta y de tracking, el tracking
      // gana: tocar una persona nunca debe abrir el popup de navegacion.
      const trackingKindAtPoint = String(getEntityProperty(entity, "trackingKind") || "");
      if (isTrackingKind(trackingKindAtPoint)) {
        const trackingIdAtPoint = Number(getEntityProperty(entity, "trackingId"));
        if (Number.isFinite(trackingIdAtPoint) && trackingIdAtPoint > 0) {
          const prefix = trackingKindAtPoint === "vehiculo" ? "V-" : trackingKindAtPoint === "equipo" ? "E-" : trackingKindAtPoint === "dispositivo" ? "D-" : "P-";
          const fullLabel = String(getEntityProperty(entity, "trackingFullLabel") || "").trim();
          return { kind: trackingKindAtPoint, id: trackingIdAtPoint, label: fullLabel || label || (prefix + trackingIdAtPoint) };
        }
      }

      if (entityId.indexOf("geomsg_") === 0 || getEntityProperty(entity, "poiTipo") === "GEO-MSG" || getEntityProperty(entity, "tacticalType") === "geomsg") {
        return { kind: "geomsg", id: entityId, label: (getEntityProperty(entity, "poiAuthor") || "Yo") + " · GEO-MSG" };
      }
      if (entityId.indexOf("poi_") === 0) {
        return { kind: "poi", id: Number(entityId.replace("poi_", "")), label: label || "Punto de Interes" };
      }
      if (entityId.indexOf("area_") === 0) {
        return { kind: "area", id: Number(entityId.replace("area_", "")), label: label || "Area de Interes" };
      }
      if (entityId.indexOf("estructura_") === 0) {
        return { kind: "structure", id: Number(entityId.replace("estructura_", "")), label: label || "Estructura" };
      }
      if (entityId.indexOf("remote_route_") === 0 ||
          entityId.indexOf("route_") === 0 ||
          entity === routeEntity ||
          entity === endEntity ||
          getEntityProperty(entity, "routeOriginLat") != null ||
          getEntityProperty(entity, "routeDestinationLat") != null ||
          getEntityProperty(entity, "tacticalType") === "navigation-route" ||
          getEntityProperty(entity, "tacticalType") === "routeDestination" ||
          getEntityProperty(entity, "poiTipo") === "RUTA") {
        const routeId = Number(getEntityProperty(entity, "routeId") || entityId.replace("remote_route_destination_", "").replace("remote_route_", ""));
        return {
          kind: "route",
          id: Number.isFinite(routeId) && routeId > 0 ? routeId : 1,
          localId: entityId,
          label: label || "Ruta de navegación"
        };
      }
      if (entityId.indexOf("ruta_operacion_") === 0) {
        return { kind: "tactical_route", id: Number(entityId.replace("ruta_operacion_", "")), label: label || "Linea tactica" };
      }

      const trackingKind = String(getEntityProperty(entity, "trackingKind") || "");
      if (isTrackingKind(trackingKind)) {
        const trackingId = Number(getEntityProperty(entity, "trackingId"));
        if (Number.isFinite(trackingId) && trackingId > 0) {
          const prefix = trackingKind === "vehiculo" ? "V-" : trackingKind === "equipo" ? "E-" : trackingKind === "dispositivo" ? "D-" : "P-";
          const fullLabel = String(getEntityProperty(entity, "trackingFullLabel") || "").trim();
          return { kind: trackingKind, id: trackingId, label: fullLabel || label || (prefix + trackingId) };
        }
      }

      const tacticalType = String(getEntityProperty(entity, "tacticalType") || "");
      if (tacticalType === "freehand-drawing") {
        const match = entityId.match(/^draw_loaded_(\d+)$/);
        return {
          kind: "drawing",
          id: match ? Number(match[1]) : null,
          localId: entityId,
          label: "Dibujo libre"
        };
      }

      return null;
    }

    function notifyRouteCreated(route) {

        if (!startPoint || !endPoint) {
          console.error("No hay origen/destino para enviar ruta a Android");
          return;

          geojson: route.geometry,
          origen_lat: startPoint.lat,
          origen_lon: startPoint.lon,
          destino_lat: endPoint.lat,
          destino_lon: endPoint.lon,
          distancia_m: Number(route.distance) || 0,
          duracion_s: Number(route.duration) || 0
        };

        console.log("Enviando ruta a Android:", payload);

        if (window.Android && typeof Android.onRouteCreated === "function") {
          Android.onRouteCreated(JSON.stringify(payload));
        } else {
          console.warn("Android.onRouteCreated no está disponible");

    try {

      // Handler de clicks
      const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);

      handler.setInputAction((movement) => {

          const cartesian = viewer.camera.pickEllipsoid(

          if (!cartesian) return;

          const cartographic = Cesium.Cartographic.fromCartesian(cartesian);
          const lat = Cesium.Math.toDegrees(cartographic.latitude);
          const lon = Cesium.Math.toDegrees(cartographic.longitude);

          if (pickMode === "start") {

      // Pulsación prolongada (Touch y Click sostenido) para crear Waypoints o Blancos.
      let mapLongPressTimer = null;
      let mapLongPressStart = null;
      let mapLongPressCameraLocked = false;
      const lockMapCameraForLongPress = function () {
        if (viewer && viewer.scene && viewer.scene.screenSpaceCameraController) {
          viewer.scene.screenSpaceCameraController.enableRotate = false;
          viewer.scene.screenSpaceCameraController.enableTranslate = false;
          viewer.scene.screenSpaceCameraController.enableZoom = false;
          mapLongPressCameraLocked = true;

      const mapCanvas = viewer.scene.canvas;

      function triggerLongPressAt(clientX, clientY) {
        try {
          const rect = mapCanvas.getBoundingClientRect();
          const position = new Cesium.Cartesian2(clientX - rect.left, clientY - rect.top);
          const cartesian = viewer.camera.pickEllipsoid(position, viewer.scene.globe.ellipsoid);
          if (!cartesian) return;
          const cartographic = Cesium.Cartographic.fromCartesian(cartesian);
          const lat = Cesium.Math.toDegrees(cartographic.latitude);
          const lon = Cesium.Math.toDegrees(cartographic.longitude);

          notifyMapLongPress(lat, lon);
          if (navigator.vibrate) navigator.vibrate(40);

          console.error("Error en pulsacion prolongada: " + e.message);
        }
      }

      const cancelMapLongPress = function () {
        if (mapLongPressTimer) clearTimeout(mapLongPressTimer);
        mapLongPressTimer = null;
        mapLongPressStart = null;
        if (mapLongPressCameraLocked && viewer && viewer.scene && viewer.scene.screenSpaceCameraController) {
          viewer.scene.screenSpaceCameraController.enableRotate = true;
          viewer.scene.screenSpaceCameraController.enableTranslate = true;
          viewer.scene.screenSpaceCameraController.enableZoom = true;
          mapLongPressCameraLocked = false;
        }
      };

      mapCanvas.addEventListener('touchstart', function (event) {
        if (_drawMode || mobileToolHandler || !event.touches || event.touches.length !== 1) return;
        const touch = event.touches[0];
        lockMapCameraForLongPress();
        mapLongPressStart = { x: touch.clientX, y: touch.clientY };
        mapLongPressTimer = setTimeout(function () {
          if (viewer && viewer.scene && viewer.scene.screenSpaceCameraController) {
            viewer.scene.screenSpaceCameraController.enableRotate = false;
            viewer.scene.screenSpaceCameraController.enableTranslate = false;
            viewer.scene.screenSpaceCameraController.enableZoom = false;
            mapLongPressCameraLocked = true;
          }
          triggerLongPressAt(touch.clientX, touch.clientY);
        }, 400);
      }, { passive: true });

      mapCanvas.addEventListener('mousedown', function (event) {
        if (_drawMode || mobileToolHandler || event.button !== 0) return;
        lockMapCameraForLongPress();
        mapLongPressStart = { x: event.clientX, y: event.clientY };
        mapLongPressTimer = setTimeout(function () {
          if (viewer && viewer.scene && viewer.scene.screenSpaceCameraController) {
            viewer.scene.screenSpaceCameraController.enableRotate = false;
            viewer.scene.screenSpaceCameraController.enableTranslate = false;
            viewer.scene.screenSpaceCameraController.enableZoom = false;
            mapLongPressCameraLocked = true;
          }
          triggerLongPressAt(event.clientX, event.clientY);
        }, 400);
      }, { passive: true });

      mapCanvas.addEventListener('touchmove', function (event) {
        if (!mapLongPressStart || !event.touches || event.touches.length !== 1) return cancelMapLongPress();
        const touch = event.touches[0];
        if (Math.hypot(touch.clientX - mapLongPressStart.x, touch.clientY - mapLongPressStart.y) > 12) cancelMapLongPress();
      }, { passive: true });

      mapCanvas.addEventListener('mousemove', function (event) {
        if (!mapLongPressStart) return;
        if (Math.hypot(event.clientX - mapLongPressStart.x, event.clientY - mapLongPressStart.y) > 12) cancelMapLongPress();
      }, { passive: true });

      mapCanvas.addEventListener('touchend', cancelMapLongPress, { passive: true });
      mapCanvas.addEventListener('touchcancel', cancelMapLongPress, { passive: true });
      mapCanvas.addEventListener('mouseup', cancelMapLongPress, { passive: true });

      const objectDragHandler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);

        if (!selectable || !["poi", "structure", "area"].includes(selectable.kind)) return;
        if (selectable.kind === "area" && !entity.ellipse) return;

        draggedObject = {
          entity: entity,
          kind: selectable.kind,
          id: selectable.id,
          label: selectable.label,
          start: Cesium.Cartesian2.clone(movement.position),
          lastLat: null,
          lastLon: null

        objectDragMoved = false;
      }, Cesium.ScreenSpaceEventType.LEFT_DOWN);

        const cartesian = viewer.camera.pickEllipsoid(
          movement.endPosition,
          viewer.scene.globe.ellipsoid

        if (!cartesian) return;

        objectDragMoved = true;
        viewer.scene.screenSpaceCameraController.enableRotate = false;
        viewer.scene.screenSpaceCameraController.enableTranslate = false;
        const cartographic = Cesium.Cartographic.fromCartesian(cartesian);
        draggedObject.lastLat = Cesium.Math.toDegrees(cartographic.latitude);
        draggedObject.lastLon = Cesium.Math.toDegrees(cartographic.longitude);
        draggedObject.entity.position = Cesium.Cartesian3.fromDegrees(
          draggedObject.lastLon,
          draggedObject.lastLat,
          0
        );
        viewer.scene.requestRender();
      }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);

      objectDragHandler.setInputAction(function () {
        if (!draggedObject) return;
        viewer.scene.screenSpaceCameraController.enableRotate = true;
        viewer.scene.screenSpaceCameraController.enableTranslate = true;
        viewer.scene.screenSpaceCameraController.enableZoom = true;

        if (objectDragMoved &&

            id: draggedObject.id,
            label: draggedObject.label,
            lat: draggedObject.lastLat,

        draggedObject = null;
        objectDragMoved = false;

    window.setOperationView = function (lat, lon, zoomMeters) {
      try {
        if (!viewer) return;
        setCameraStateKey(lat, lon, zoomMeters);

        if (!firstOperationViewHandled) {
          firstOperationViewHandled = true;
          if (restoreCameraState()) return;

        if (restoredCameraAt && Date.now() - restoredCameraAt < 7000) {
          return;
        }

        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(
            lon,
            lat,
            Math.max(Number(zoomMeters) || 15000, FOLLOW_LOCATION_ZOOM)
          ),
          duration: 2.5
        });
      } catch (e) {
        console.error("Error en setOperationView: " + e.message);
      }

        if (!viewer) return;

          lastKnownUserLocation = { lat: Number(lat), lon: Number(lon) };

        if (showMarker === false) {

            flyToLocation(lat, lon, FOLLOW_LOCATION_ZOOM, 0.45);

          return;

        const marker = getTrackingMilMarker({ kind: "personal", tacticalType: "personal" }, "Mi ubicacion");

    function normalizeTrackingText(value) {
      return String(value || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toUpperCase();
    }

    function textIncludes(text) {
      const needles = Array.prototype.slice.call(arguments, 1);
      return needles.some(function (needle) { return text.indexOf(needle) >= 0; });
    }

    function compactTrackingLabel(value, maxChars) {
      const limit = Number(maxChars) || TRACKING_LABEL_MAX_CHARS;
      const text = String(value || "").replace(/\s+/g, " ").trim();
      if (!text || text.length <= limit) return text;
      return text.slice(0, Math.max(1, limit - 3)).trim() + "...";
    }

    function stripTrackingIdentityPrefix(value) {
      return String(value || "")
        .replace(/^[A-Z0-9_-]{8,}\s*-\s*/i, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function makeTrackingMapLabel(kind, label, options) {
      const source = options || {};
      const trackingKind = kind || source.tacticalType || source.kind || "";
      if (trackingKind !== "equipo") return compactTrackingLabel(label, TRACKING_LABEL_MAX_CHARS);

      const text = normalizeTrackingText([
        source.categoria,
        source.tipo_equipo,
        source.tipo,
        source.nombre,
        label
      ].filter(Boolean).join(" "));

      const preferred = stripTrackingIdentityPrefix(source.nombre || source.tipo_equipo || label);
      if (textIncludes(text, "DRON", "DRONE", "UAV", "MATRICE")) {
        const droneLabel = preferred.replace(/\bDJI\b\s*/i, "").trim() || preferred || "Dron";
        return compactTrackingLabel(droneLabel, TRACKING_DRONE_LABEL_MAX_CHARS);
      }

      return compactTrackingLabel(preferred || label, TRACKING_LABEL_MAX_CHARS);
    }

    function buildMilSidc(identity, dimension, icon) {
      const safeIdentity = String(identity || "F").slice(0, 1);
      const safeDimension = String(dimension || "G").slice(0, 1);
      const safeIcon = String(icon || "U-----").padEnd(6, "-").slice(0, 6);
      return "S" + safeIdentity + safeDimension + "P" + safeIcon + "-----";
    }

    function getFallbackTrackingSidc(kind) {
      if (kind === "vehiculo") return buildMilSidc("F", "G", "EV----");
      if (kind === "equipo") return buildMilSidc("F", "G", "E-----");
      if (kind === "dispositivo") return buildMilSidc("F", "G", "UCS---");
      return buildMilSidc("F", "G", "UCI---");
    }

    function resolveTrackingMilSymbol(options, label) {
      options = options || {};
      const kind = options.tacticalType || options.kind || "personal";
      const providedSidc = options.sidc || options.codigo_sidc || options.mil_sidc;
      if (providedSidc) return String(providedSidc);

      const text = normalizeTrackingText([
        kind,
        label,
        options.rol,
        options.rol_en_operacion,
        options.role,
        options.tipo,
        options.tipo_equipo,
        options.categoria,
        options.nombre,
        options.alias,
        options.codigo_interno,
        options.modelo,
        options.marca
      ].filter(Boolean).join(" "));

      if (kind === "vehiculo") {
        if (textIncludes(text, "AMBULANC", "MEDIC")) return buildMilSidc("F", "G", "UCM---");
        if (textIncludes(text, "BLIND", "TANQUE", "ARMORED")) return buildMilSidc("F", "G", "UCD---");
        if (textIncludes(text, "PATRULL", "POLIC", "SEGUR")) return buildMilSidc("F", "G", "UCF---");
        return buildMilSidc("F", "G", "EV----");
      }

      if (kind === "equipo") {
        if (textIncludes(text, "DRON", "DRONE", "UAV", "MATRICE")) return buildMilSidc("F", "A", "MFQ---");
        if (textIncludes(text, "RADIO", "COMUNIC", "SENAL", "SIGNAL")) return buildMilSidc("F", "G", "UCS---");
        if (textIncludes(text, "ARMA", "RIFLE", "PISTOLA", "FUSIL")) return buildMilSidc("F", "G", "EW----");
        if (textIncludes(text, "CAMARA", "SENSOR", "TACTICO")) return buildMilSidc("F", "G", "EX----");
        return buildMilSidc("F", "G", "E-----");

      if (kind === "dispositivo") {

        if (textIncludes(text, "TELEFONO", "CELULAR", "TABLET", "RADIO", "LORA", "COMUNIC")) return buildMilSidc("F", "G", "UCS---");
        if (textIncludes(text, "CAMARA", "CAMERA")) return buildMilSidc("F", "G", "EX----");
        return buildMilSidc("F", "G", "E-----");
      }

      if (textIncludes(text, "CUT", "CET")) return buildMilSidc("F", "G", "UCI---");
      if (textIncludes(text, "CELL", "CELULA")) return buildMilSidc("F", "G", "UCI---");
      if (textIncludes(text, "PATRULL", "POLIC", "SEGUR")) return buildMilSidc("F", "G", "UCF---");
      return getFallbackTrackingSidc("personal");

    function renderTrackingMilSymbol(sidc) {
      if (!sidc || typeof ms === "undefined" || typeof ms.Symbol !== "function") return null;
      if (trackingSymbolImageCache.has(sidc)) return trackingSymbolImageCache.get(sidc);

      try {
        const symbol = new ms.Symbol(sidc, {
          size: TRACKING_SYMBOL_RENDER_SIZE,
          colorMode: "Light"
        });

        if (typeof symbol.isValid === "function" && symbol.isValid() === false) {
          trackingSymbolImageCache.set(sidc, null);
          return null;
        }

        if (typeof symbol.asSVG !== "function") {
          trackingSymbolImageCache.set(sidc, null);
          return null;
        }

        const svg = symbol.asSVG();
        if (!svg || />\s*\?\s*</.test(svg)) {
          trackingSymbolImageCache.set(sidc, null);
          return null;
        }

        const image = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
        trackingSymbolImageCache.set(sidc, image);
        return image;
      } catch (e) {
        console.warn("[TRACKING] No se pudo generar simbolo MIL:", sidc, e);
        trackingSymbolImageCache.set(sidc, null);
        return null;
      }

      let image = renderTrackingMilSymbol(sidc);

      if (!image && sidc !== fallbackSidc) {

    function coordinateNumber(value) {
      if (value === undefined || value === null) return null;

      return Number.isFinite(number) ? number : null;
    }

    function normalizeCoordinatePair(lat, lon) {
      const nLat = coordinateNumber(lat);
      const nLon = coordinateNumber(lon);
      if (nLat === null || nLon === null) return null;
      if (Math.abs(nLat) > 90 || Math.abs(nLon) > 180) return null;
      if (nLat === 0 && nLon === 0) return null;
      return { lat: nLat, lon: nLon };
    }

    function trackingHeadingKey(kind, key) {

    function normalizeHeadingDegrees(value) {
      if (value === undefined || value === null) return null;
      const text = String(value).replace("Â°", "").trim();
      if (!text) return null;
      const number = Number(text);
      if (!Number.isFinite(number)) return null;
      return ((number % 360) + 360) % 360;
    }

    function firstHeadingValue(options) {
      const source = options || {};
      const keys = [
        "rumbo_grados",
        "rumboGrados",
        "headingDegrees",
        "heading",
        "heading_deg",
        "bearing",
        "curso",
        "rumbo"
      ];
      for (let i = 0; i < keys.length; i += 1) {
        const value = source[keys[i]];
        if (value !== undefined && value !== null && String(value).trim() !== "") return value;
      }
      return null;
    }

    function makeHeadingLinePositions(position, headingDegrees) {
      const headingRadians = Cesium.Math.toRadians(headingDegrees);
      const eastMeters = Math.sin(headingRadians) * HEADING_LINE_LENGTH_METERS;
      const northMeters = Math.cos(headingRadians) * HEADING_LINE_LENGTH_METERS;
      const enu = Cesium.Transforms.eastNorthUpToFixedFrame(position);
      const endPosition = Cesium.Matrix4.multiplyByPoint(
        enu,
        new Cesium.Cartesian3(eastMeters, northMeters, 0),
        new Cesium.Cartesian3()
      );
      return [position, endPosition];
    }

    function removeTrackingHeadingEntity(kind, key) {

    function upsertTrackingHeadingEntity(kind, key, position, color, options) {

      if (headingDegrees === null) {

      const id = trackingHeadingKey(kind, key);

        entity.name = "Rumbo " + headingDegrees.toFixed(0) + "Â°";

    function drawEmergencyPulse(id, position) {
      if (!viewer || !id || !position) return;

      removeEmergencyPulse(id);

      const startedAt = Date.now();
      const durationMs = 4200;
      const pulseEntities = EMERGENCY_PULSE_COLORS.map(function (color, index) {
        const delayMs = index * 430;
        const entity = viewer.entities.add({
          name: "Emergencia personal " + id,
          position: position,
          ellipse: {
            semiMajorAxis: new Cesium.CallbackProperty(function () {
              const progress = Math.max(0, Math.min(1, (Date.now() - startedAt - delayMs) / durationMs));
              return 35 + progress * 360;
            }, false),
            semiMinorAxis: new Cesium.CallbackProperty(function () {
              const progress = Math.max(0, Math.min(1, (Date.now() - startedAt - delayMs) / durationMs));
              return 35 + progress * 360;
            }, false),
            material: new Cesium.ColorMaterialProperty(
              new Cesium.CallbackProperty(function () {
                const progress = Math.max(0, Math.min(1, (Date.now() - startedAt - delayMs) / durationMs));
                const alpha = progress <= 0 ? 0 : Math.max(0, 0.68 * (1 - progress));
                return color.withAlpha(alpha);

            ),
            outline: true,
            outlineColor: color.withAlpha(0.95),
            outlineWidth: 4,
            height: 0
          }
        });
        return entity;
      });

      emergencyPulseEntities.set(id, pulseEntities);

    function firstTrackingValue() {
      for (let i = 0; i < arguments.length; i += 1) {
        const value = arguments[i];
        if (value !== undefined && value !== null && String(value).trim() !== "") return value;
      }
      return null;
    }

    function normalizeHeadingDegrees(value) {
      if (value === undefined || value === null || String(value).trim() === "") return null;
      const degrees = Number(value);
      if (!Number.isFinite(degrees)) return null;
      return ((degrees % 360) + 360) % 360;
    }

    function trackingHeadingDegrees(meta) {
      const source = meta || {};
      return normalizeHeadingDegrees(firstTrackingValue(
        source.rumbo_grados,
        source.rumboGrados,
        source.headingDegrees,
        source.heading,
        source.bearing,
        source.curso,
        source.rumbo
      ));
    }

    function headingEndPosition(lat, lon, headingDegrees, meters, startMeters, heightMeters) {
      const origin = Cesium.Cartesian3.fromDegrees(lon, lat, Number(heightMeters) || 0);
      const radians = Cesium.Math.toRadians(headingDegrees);
      const startDistance = Number.isFinite(startMeters) ? startMeters : TRACKING_HEADING_START_M;
      const localStart = new Cesium.Cartesian3(
        Math.sin(radians) * startDistance,
        Math.cos(radians) * startDistance,
        0
      );
      const localEnd = new Cesium.Cartesian3(
        Math.sin(radians) * meters,
        Math.cos(radians) * meters,
        0
      );
      const enu = Cesium.Transforms.eastNorthUpToFixedFrame(origin);
      const start = Cesium.Matrix4.multiplyByPoint(enu, localStart, new Cesium.Cartesian3());
      const end = Cesium.Matrix4.multiplyByPoint(enu, localEnd, new Cesium.Cartesian3());
      return { start, end };
    }

    function poiArrowPositions(lat, lon, headingDegrees) {
      const origin = Cesium.Cartesian3.fromDegrees(lon, lat, 3);
      const radians = Cesium.Math.toRadians(headingDegrees);
      const enu = Cesium.Transforms.eastNorthUpToFixedFrame(origin);
      const toWorld = (east, north) => Cesium.Matrix4.multiplyByPoint(
        enu,
        new Cesium.Cartesian3(east, north, 0),
        new Cesium.Cartesian3()
      );
      // Sale por debajo del símbolo, hace un quiebre y termina apuntando al rumbo.
      const elbow = toWorld(0, -13);
      const tipEast = Math.sin(radians) * POI_HEADING_LENGTH_M;
      const tipNorth = Math.cos(radians) * POI_HEADING_LENGTH_M;
      const headLength = 8;
      const headWidth = 4;
      const tip = toWorld(tipEast, tipNorth);
      const headLeft = toWorld(
        tipEast - Math.sin(radians) * headLength - Math.cos(radians) * headWidth,
        tipNorth - Math.cos(radians) * headLength + Math.sin(radians) * headWidth
      );
      const headRight = toWorld(
        tipEast - Math.sin(radians) * headLength + Math.cos(radians) * headWidth,
        tipNorth - Math.cos(radians) * headLength - Math.sin(radians) * headWidth
      );
      return [toWorld(0, -5), elbow, tip, headLeft, tip, headRight];
    }

    function upsertTrackingHeadingLine(trackingKey, lat, lon, color, meta) {

        return;

      const positions = headingEndPosition(lat, lon, heading, TRACKING_HEADING_LENGTH_M);
      const current = trackingHeadingEntities.get(trackingKey);
      if (current) {
        current.polyline.positions = [positions.start, positions.end];
        current.polyline.material = color.withAlpha(0.92);
        current.name = "Rumbo " + Math.round(heading) + "Â°";
        current.properties.headingDegrees = heading;
        return;

      const entity = viewer.entities.add({
        name: "Rumbo " + Math.round(heading) + "Â°",
        polyline: {
          positions: [positions.start, positions.end],
          width: 3,
          material: color.withAlpha(0.92),
          clampToGround: false
        },
        properties: {
          trackingKind: "heading",
          trackingKey: trackingKey,
          tacticalType: "tracking-heading",
          headingLine: true,
          headingDegrees: heading

      trackingHeadingEntities.set(trackingKey, entity);

    function cacheTrackingDispositivo(idValue, lat, lon, label, meta) {

    function upsertTrackingEntity(store, key, lat, lon, label, color, meta) {

          backgroundPadding: new Cesium.Cartesian2(5, 3)
        } : undefined,
        properties: {
          trackingKind: options.kind || "",
          trackingId: String(key),
          trackingKey: options.trackingKey || "",
          tacticalType: options.tacticalType || "",
          trackingSidc: marker.sidc || "",
          trackingFullLabel: label,
          trackingMapLabel: mapLabel || label,
          velocidad: options.velocidad ?? 0,
          active: options.active === true
        }
      });

      store.set(key, entity);
      upsertTrackingHeadingLine(options.trackingKey || (options.kind + ":" + key), coords.lat, coords.lon, color, options);

      if (isTrackingKind(options.kind)) {

    function reevaluateAndroidClusters() {
      if (!viewer) return;

      const vehicles = [];
      const persons = [];

      trackingVehiculoEntities.forEach((entity, id) => {
        const pos = entity.position?.getValue(Cesium.JulianDate.now());
        if (pos) {
          vehicles.push({ id, entity, cartesian: pos });
        }
      });

      trackingPersonalEntities.forEach((entity, id) => {
        const pos = entity.position?.getValue(Cesium.JulianDate.now());
        if (pos) {
          persons.push({ id, entity, cartesian: pos });
        }
      });

      const CLUSTER_DISTANCE_METERS = 30;

      persons.forEach(p => {
        let minDistance = Infinity;
        let closestVehicle = null;

        vehicles.forEach(v => {
          const distance = Cesium.Cartesian3.distance(p.cartesian, v.cartesian);
          if (distance < minDistance) {
            minDistance = distance;
            closestVehicle = v;
          }
        });

        let shouldShow = true;

        if (closestVehicle && minDistance <= CLUSTER_DISTANCE_METERS) {
          const moving = isAndroidVehicleMoving(closestVehicle.entity);
          shouldShow = !moving;
        }

        if (p.entity.show !== shouldShow) {
          p.entity.show = shouldShow;
        }

        const headingLine = trackingHeadingEntities.get("P:" + p.id);
        if (headingLine && headingLine.show !== shouldShow) {
          headingLine.show = shouldShow;
        }
      });
    }

      window.clearPttEmergencyZones();

      var tracked = idPersonal != null ? trackingPersonalEntities.get(String(Number(idPersonal))) : null;
      var position = tracked && tracked.position
        ? tracked.position
        : Cesium.Cartesian3.fromDegrees(Number(lon), Number(lat), 1);
      var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var startedAt = performance.now();
      var cycleMs = 2400;
      var zones = [
        { id: "ptt-emergency-zone-outer", radius: 300, delay: 0, fill: "#DC2626", alpha: 0.48, outline: "#EF4444" },
        { id: "ptt-emergency-zone-middle", radius: 230, delay: 0.28, fill: "#F59E0B", alpha: 0.52, outline: "#FBBF24" },
        { id: "ptt-emergency-zone-inner", radius: 155, delay: 0.56, fill: "#D9E6A3", alpha: 0.66, outline: "#67E8F9" }
      ];

      zones.forEach(function (zone) {
        var progress = function () {
          if (reduceMotion) return 1;
          var elapsed = (performance.now() - startedAt) / cycleMs;
          return (elapsed + zone.delay) % 1;
        };
        var radius = new Cesium.CallbackProperty(function () {
          var p = progress();
          return 45 + (zone.radius - 45) * (1 - Math.pow(1 - p, 3));
        }, false);
        var baseColor = Cesium.Color.fromCssColorString(zone.fill);
        viewer.entities.add({
          id: zone.id,
          position: position,
          ellipse: {
            semiMajorAxis: radius,
            semiMinorAxis: radius,
            material: new Cesium.ColorMaterialProperty(new Cesium.CallbackProperty(function () {
              var p = progress();
              return baseColor.withAlpha(reduceMotion ? zone.alpha : zone.alpha * Math.pow(1 - p, 1.35));
            }, false)),
            outline: true,
            outlineColor: Cesium.Color.fromCssColorString(zone.outline),

            height: 1,
            classificationType: Cesium.ClassificationType.BOTH

    async function getOsrmRoute(start, end) {
      const url =
        `${OSRM_BASE}/route/v1/driving/` +
        `${start.lon},${start.lat};${end.lon},${end.lat}` +
        `?overview=full&geometries=geojson`;

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 900000);

      try {
        const response = await fetch(url, {
          signal: controller.signal
        });

        if (!response.ok) {
          throw new Error("No se pudo obtener ruta");
        }

        const data = await response.json();

        if (!data.routes || !data.routes.length) {
          throw new Error("No hay ruta disponible");
        }

        return data.routes[0];
      } catch (err) {
        if (err.name === "AbortError") {
          throw new Error("La consulta de ruta tardÃ³ demasiado");
        }
        throw err;
      } finally {
        clearTimeout(timeoutId);
      }
    }

    function routeScopeKey(route) {
      const creator = route && (route.creador_nombre || route.routeCreator || route.creador || route.createdBy);
      if (creator && String(creator).trim()) return "creator:" + String(creator).trim().toLowerCase();
      const vehicleId = Number(route && route.id_vehiculo);

    function clearRemoteRoutesForScope(scope) {
      Array.from(remoteRoutes.entries()).forEach(function (entry) {
        const id = entry[0];
        const entity = entry[1];
        if (entity && entity._routeScope === scope) {
          viewer.entities.remove(entity);
          if (entity._destinationEntity) viewer.entities.remove(entity._destinationEntity);
          remoteRoutes.delete(id);
        }
      });

    window.loadRemoteRoutes = function (routesArray, replace) {

          viewer.entities.remove(entity);
          if (entity._destinationEntity) viewer.entities.remove(entity._destinationEntity);
        });
        remoteRoutes.clear();
      }

      const latestByScope = new Map();
      routesArray.forEach(function (route) {
        const routeId = Number(route && route.id_ruta);
        if (!Number.isFinite(routeId)) return;
        const scope = routeScopeKey(route);
        const current = latestByScope.get(scope);
        const currentId = Number(current && current.id_ruta);
        if (!current || !Number.isFinite(currentId) || routeId > currentId) {
          latestByScope.set(scope, route);
        }
      });
      latestByScope.forEach(function (route) {
        drawRemoteRoute(route);
      });
